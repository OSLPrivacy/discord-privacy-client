# TASK 5180b - throwaway harness crate for the archive-expansion starvation
# proof. `scripts/task-5180b-archive-expansion-escape.sh` copies this file, its
# `main.rs`, and the VERBATIM production sources
# `apps/osl-hub/src/protected_archive.rs`,
# `apps/osl-hub/src/protected_download_quarantine.rs` and
# `apps/osl-hub/src/protected_download_quarantine_amsi.ps1` into a throwaway
# directory, starves one bound at a time in the copy, and discards the copy.
# Nothing here is part of the shipped binary.
[package]
name = "task-5180b-check"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "task-5180b-check"
path = "main.rs"

# Exactly the dependencies the two production modules already use, at the
# versions apps/osl-hub/Cargo.toml pins. That is what lets this harness compile
# the real sources rather than a re-implementation of them.
[dependencies]
base64 = "=0.22.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
flate2 = "=1.1.9"
tar = "=0.4.46"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[workspace]
