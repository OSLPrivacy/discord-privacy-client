# TASK 5181b - throwaway harness crate for the zone-handoff starvation proof.
# `scripts/task-5181b-zone-handoff-starvation.sh` copies this file, its
# `main.rs`, and the VERBATIM production sources
# `apps/osl-hub/src/download_zone_handoff.rs` and
# `apps/osl-hub/src/download_zone_handoff.ps1` into a throwaway directory,
# starves the Attachment Services handoff in the copy, and discards the copy.
# Nothing here is part of the shipped binary.
[package]
name = "task-5181b-check"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "task-5181b-check"
path = "main.rs"

# The production zone handoff depends on nothing but std and base64, which is
# what lets this harness compile the real source rather than a re-implementation
# of it.
[dependencies]
base64 = "=0.22.1"

[workspace]
