"$schema" = "../gen/schemas/desktop-schema.json"

# Persist the user's start-with-Windows on/off choice to
# app_preferences.json. Platform-specific autostart registration is
# handled separately from this saved preference.
[[permission]]
identifier = "allow-osl-save-start-with-windows-choice"
description = "Permits the trusted local settings window to invoke `osl_save_start_with_windows_choice` (persist the on/off choice for starting OSL when Windows starts)."
commands.allow = ["osl_save_start_with_windows_choice"]
