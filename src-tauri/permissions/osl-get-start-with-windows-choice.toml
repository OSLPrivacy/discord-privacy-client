"$schema" = "../gen/schemas/desktop-schema.json"

# Read the persisted start-with-Windows on/off choice from
# app_preferences.json. This does not inspect or mutate the OS
# autostart registration.
[[permission]]
identifier = "allow-osl-get-start-with-windows-choice"
description = "Permits the trusted local settings window to invoke `osl_get_start_with_windows_choice` (read the saved on/off choice for starting OSL when Windows starts)."
commands.allow = ["osl_get_start_with_windows_choice"]
