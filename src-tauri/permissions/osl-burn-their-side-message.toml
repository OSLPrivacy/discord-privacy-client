"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-osl-burn-their-side-message"
description = "Permits the trusted local settings window to invoke `osl_burn_their_side_message`, which signs a remote single-message wrapped-key burn while preserving this device's local stored message."
commands.allow = ["osl_burn_their_side_message"]
