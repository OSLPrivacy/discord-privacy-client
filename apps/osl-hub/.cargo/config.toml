# This nested workspace needs a configuration home of its own: `tauri build`
# runs from apps/osl-hub, rather than from the repository workspace. Keep
# Windows release linker flags here so they reach the shipping binary.
#
# Do not add /Brepro as a general build flag. It disables incremental linking;
# the release-only reproducibility work owns that flag.

# llama.cpp contributes C++ and OpenMP archives to the Windows GNU binary.
# The C driver does not search the MinGW C++ runtime installed by the shipping
# cross-toolchain, so the final link must go through the C++ driver.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-g++"
