[package]
name = "osl-hub"
version = "0.1.0"
default-run = "osl-privacy-hub"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97.1"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
# Restored: a merge dropped these while keeping the code in attachment_scan.rs
# that uses them, so the crate failed with 26 "unresolved module or unlinked
# crate" errors. Versions are the exact pins from 05ed3686.
calamine = { version = "=0.36.0", default-features = false }
flate2 = "=1.1.9"
pdf-extract = "=0.12.0"
quick-xml = "=0.41.0"
tar = "=0.4.46"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
lopdf = { version = "=0.42.0", default-features = false }
adapter-profile = { path = "../../crates/adapter-profile" }
cover-draft = { path = "../../crates/cover-draft", package = "osl-cover-draft" }
# This policy must be linked by the desktop send boundary, rather than living
# only in an isolated workspace test crate.
cover-ai = { path = "../../crates/cover-ai", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
minisign-verify = "=0.2.5"
tauri = { version = "=2.11.1", features = ["unstable"], optional = true }
tauri-plugin-updater = { version = "=2.9.0", optional = true }
tauri-plugin-single-instance = { version = "=2.4.2", optional = true }
tauri-plugin-dialog = { version = "=2.7.2", default-features = false, optional = true }
tokio = { version = "=1.49.0", features = ["sync", "time"], optional = true }
ipc = { path = "../../crates/ipc", optional = true }
keystore = { path = "../../crates/keystore", optional = true }
crypto = { path = "../../crates/crypto", optional = true }
store = { path = "../../crates/store", optional = true }
transport = { path = "../../crates/transport" }
# The receipt state machine behind timed deletion and view-once expiry. Pure,
# no I/O; `message_expiry` is the sealed-storage and scheduling shell around it.
message-lifecycle = { path = "../../crates/message-lifecycle", optional = true }
runtime = { path = "../../crates/runtime", optional = true }
# The carrier planner shapes the payload-bearing cover to the protected row's
# rendered line count (`stego::shape_cover`). `discord_carrier_geometry` is not
# behind `core`, so this cannot be an optional dependency: the planner must obey
# the same row contract in every build that can compile it.
stego = { path = "../../crates/stego" }
sensitive-classify = { path = "../../crates/sensitive-classify" }
sha2 = "=0.10.9"
tracing = { version = "=0.1.44", optional = true }
# D-142: this binary shipped with `tracing` events and no subscriber, so every
# `tracing::error!` in the workspace was dropped by `NoSubscriber`. Same pin the
# legacy src-tauri shell already resolves (src-tauri/Cargo.toml:41).
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"], optional = true }
bip39 = { version = "=2.2.2", default-features = false, features = ["std"], optional = true }
# Attachment scanning is available outside `core` and decodes its bounded,
# in-memory transport envelope directly, so this is not a core-only dependency.
base64 = "=0.22.1"
url = "=2.5.8"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
zeroize = "=1.9.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# apps/osl-hub is EXCLUDED from the workspace (Cargo.toml:31), so it has no
# workspace.dependencies to inherit from - pinned explicitly to the version the
# workspace root uses. `{ workspace = true }` here fails to parse the manifest
# outright, which stops the desktop build.
rand = "0.8"
# IMAP is deliberately built without its native-TLS default. The IMAP client
# added by T12-I2 must establish a rustls connection before it sends commands
# or app-password credentials; no plaintext fallback is available.
imap = { version = "=2.4.1", default-features = false }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "=3.13"
# `tests/osl_chat_eager_fetch.rs` builds a unique temp path with `Uuid::new_v4`.
# This crate is excluded from the workspace, so the version is pinned explicitly
# to the one already resolved in this crate's own lockfile.
uuid = { version = "=1.24.0", features = ["v4"] }
osl-ratchet-next = { path = "../../crates/osl-ratchet-next" }
# `tests/first_run_identity_list_async.rs` reproduces the identity-list read on
# the multi-thread runtime an `async` Tauri command body actually runs on.
# Same pin as the optional `desktop` dependency above.
tokio = { version = "=1.49.0", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.56.0", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility"] }

# Linux-only, and only so the desktop binary can be BUILT and screenshotted on
# this machine. `tauri-plugin-dialog` is declared with default-features = false,
# which leaves its `rfd` dependency with no backend on Linux and fails the build
# with "You need to choose at least one backend". Windows is unaffected: rfd uses
# the Win32 backend unconditionally, so the shipping artifact is unchanged. This
# exists because capture protection is compile-time and Windows-only, so a
# production Windows window cannot be screenshotted at all.
[target.'cfg(target_os = "linux")'.dependencies]
# NOT optional: an optional dep is inert unless a feature turns it on, so the
# gtk3 backend never reached the transitive rfd and the build still failed.
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }

[features]
# The WhatsApp protected surface is part of the shipped desktop product, so it
# is compiled into the standard binary and keeps its historical feature name.
# Nothing that provisions a disposable QA account may be listed here: see
# `whatsapp-qa-identity` below for the half that was split back out.
default = ["core", "whatsapp-qa-shell", "native-cover-writer"]
core = ["dep:bip39", "dep:crypto", "dep:ipc", "dep:keystore", "dep:message-lifecycle", "dep:store", "dep:tracing", "dep:tracing-subscriber"]
desktop = ["dep:runtime", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:tokio", "core"]
native-cover-writer = ["cover-ai/local-model"]
custom-protocol = ["tauri/custom-protocol"]
# Disposable two-VM Discord testing only. This is deliberately a native build
# feature rather than a renderer/runtime switch, so production binaries cannot
# enter the passwordless path from JavaScript or an environment variable.
discord-qa-shell = []
signal-qa-shell = []
whatsapp-qa-shell = []
# The disposable WhatsApp LAB IDENTITY. Never put this in `default`.
#
# `whatsapp-qa-shell` above is the shipped protected surface, and it stays in
# the default set. This feature is the other half that used to ride along with
# it: a startup hook that, on exactly the empty-profile case, creates a device
# identity, installs a random machine password and zeroizes the 12-word
# recovery phrase, plus the offer-file pairing exchange that only a paired lab
# VM can complete. In a build a real user installs, that hook consumed the
# first run: `identity.json` existed before the app drew a window, onboarding
# skipped straight past account creation, and the recovery step reported "No
# recovery secret is available" for an account whose phrase had already been
# destroyed. Two-VM WhatsApp QA opts in explicitly:
#   cargo build --features desktop,whatsapp-qa-identity
whatsapp-qa-identity = ["whatsapp-qa-shell"]
# Fault-injection seam used only by the named TASK 3234 integration target.
# Normal/default/desktop builds do not include it.
task-3234-test = ["keystore/task-3235-test"]

[lib]
# The package is `osl-hub` so it can be selected with `cargo -p osl-hub`.
# Keep the established Rust crate name used by the desktop binary and tests.
name = "osl_privacy_hub"

[[bin]]
name = "osl-privacy-hub"
path = "src/main.rs"
# KEEP THIS. `src/main.rs` uses `tauri`, `tauri-plugin-*`, `runtime` and `tokio`,
# all of which are OPTIONAL dependencies enabled only by `desktop`. Without the
# gate the binary cannot compile at all with default features, and the
# `--features core --lib` / `--features core --test windows_identity_lifecycle`
# jobs -- which exist so the core models and persistence can be tested on hosts
# with no GTK/WebKit development packages -- would have to build a native webview
# to run. That is what `required-features` is for and it stays.
#
# D-267 is its cost, and it is paid elsewhere, not by deleting this line:
# `cargo check --bins` WITHOUT `--features desktop` matches no target, prints
# `warning: target filter `bins` specified, but no targets matched; this is a
# no-op`, and EXITS 0 -- measured at exit 0 on this tree with `compile_error!()`
# injected into src/main.rs. Every hub-binary check must therefore go through
# `node scripts/ci/hub-bin-check.mjs`, which reads cargo's own record of what it
# compiled and refuses to report success unless this target is in it.
#
# A second `[[bin]]` holding a `compile_error!` guard was designed and rejected:
# tauri-cli 2.11.1 finds the app binary via `binaries.iter().find(|x| x.main())`
# where `is_main` is `file_name == package.name || file_name == default_run`.
# This package is `osl-hub` and this binary is `osl-privacy-hub`, so the release
# resolves it only through the single-binary fallback; a second binary breaks
# `tauri build` outright, and every bin whose required-features are satisfied is
# also copied into the bundle. See scripts/ci/hub-bin-check.mjs.
required-features = ["desktop"]

[[bin]]
name = "osl-allowed-place"
path = "src/bin/osl-allowed-place.rs"
required-features = ["core"]

# ThinLTO preserves cross-crate release optimisation without the 20–30 GB
# single-LLVM-process peak of fat LTO, which is not viable for local release
# builds on the development machines. Keep one codegen unit for the shipping
# binary; the slower compile is confined to release builds.
[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
opt-level = 3

# Keep this preview crate isolated from the production workspace until its
# architecture and security boundaries have been reviewed. This also lets it
# be checked with `cargo check --manifest-path apps/osl-hub/Cargo.toml
# --features desktop` without editing the repository's root workspace manifest.
# The feature is not decoration here: WITHOUT it that command checks the library
# and silently skips the `[[bin]]` above, and still exits 0 (D-267).
[workspace]
resolver = "2"
