[package]
name = "task-3070-mail-com-deleter"
version = "0.1.0"
edition = "2021"
publish = false

# A standalone per-task command crate, the pattern `task_3045_shared_mail_deleter/`
# established for exactly this gate. It does not copy anything: `src/main.rs`
# compiles `../src/mail_com_mail_deleter.rs`, `../src/shared_mail_deleter.rs`,
# `../src/mail_owner_check.rs` and `../src/row_who_wrote_it.rs` straight out of
# `apps/osl-hub/src/`, by path.
#
# It exists because the `osl-hub` lib does not parse on this branch: 29 files
# under `apps/osl-hub/src/` carry merge damage that predates this task,
# including `lib.rs` itself (two `pub mod service_connections;` lines) and
# `scrub_imap.rs` (where the Mail.com reader from TASK 3068 lives). This crate is
# what lets the Mail.com deleter be run and checked today, against the same bytes
# the lib will build once that damage is repaired.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }

[workspace]
