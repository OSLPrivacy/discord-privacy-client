[package]
name = "task-5200-account-export"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
task-5200-clean-reader = { path = "../task_5200_clean_reader" }
tempfile = "3.13"

[dev-dependencies]

[lib]
path = "src/lib.rs"

[[test]]
name = "task_5200_account_export"
path = "tests/task_5200_account_export.rs"

[[test]]
name = "task_5200_shipping_boundary"
path = "tests/task_5200_shipping_boundary.rs"

[[bin]]
name = "task_5200b_probe"
path = "src/bin/task_5200b_probe.rs"

[[test]]
name = "task_5200b_portability"
path = "tests/task_5200b_portability.rs"
