description = "Read owner-bound named launch server records for the active OSL identity."
commands.allow = ["list_hub_named_servers"]

[[permission]]
identifier = "allow-get-hub-friend-future-account-auto-whitelist"
description = "Read one friend's encrypted local preference for automatically allowing accounts added later."
commands.allow = ["get_hub_friend_future_account_auto_whitelist"]

[[permission]]
identifier = "allow-set-hub-friend-future-account-auto-whitelist"
description = "Set one friend's encrypted local preference for automatically allowing accounts added later."
commands.allow = ["set_hub_friend_future_account_auto_whitelist"]

[[permission]]
identifier = "allow-osl-mail-plan-protected-forward"
description = "Classify requested protected-forward recipients into OSL recipients and no-OSL warnings before forwarding."
commands.allow = ["osl_mail_plan_protected_forward"]

[[permission]]
identifier = "allow-osl-mail-forward-protected"
description = "Forward protected OSL Mail only after any no-OSL recipient warning has been explicitly confirmed."
commands.allow = ["osl_mail_forward_protected"]

[[permission]]
identifier = "allow-set-hub-app-notification-choice"
description = "Persist whether one local app is allowed to create OSL activity notifications on this device."
commands.allow = ["set_hub_app_notification_choice"]

[[permission]]
identifier = "allow-list-hub-app-notification-choices"
description = "List the saved per-app OSL activity notification choices for this device."
commands.allow = ["list_hub_app_notification_choices"]

[[permission]]
identifier = "allow-set-hub-look-choice"
description = "Persist one bounded local OSL visual look choice for this device."
commands.allow = ["set_hub_look_choice"]

[[permission]]
identifier = "allow-get-hub-look-choice"
description = "Read one saved bounded local OSL visual look choice for this device."
commands.allow = ["get_hub_look_choice"]

[[permission]]
identifier = "allow-list-hub-look-choices"
description = "List the saved bounded local OSL visual look choices for this device."
commands.allow = ["list_hub_look_choices"]

[[permission]]
identifier = "allow-save-scrub-setup"
description = "Save the local Scrub setup account count, automatic schedule, and notice setting selected during trusted setup."
commands.allow = ["save_scrub_setup"]

[[permission]]
identifier = "allow-check-hub-password-reset-phrase"
description = "Check a password-recovery phrase from the trusted bundled OSL Privacy UI and return only an approved/refused reset verdict plus the opaque token required by the password-change step."
commands.allow = ["check_hub_password_reset_phrase"]

[[permission]]
identifier = "allow-set-hub-friend-account-reach-choice"
description = "Save one verified friend's reach choice for one exact local service account in encrypted device-local state."
commands.allow = ["set_hub_friend_account_reach_choice"]

[[permission]]
identifier = "allow-list-hub-friend-account-reach-choices"
description = "List one verified friend's saved reach choices across local service accounts from encrypted device-local state."
commands.allow = ["list_hub_friend_account_reach_choices"]

[[permission]]
identifier = "allow-installed-build-record"
description = "Read the startup-installed build version and file fingerprint record; it copies an already-managed value and performs no I/O, no network operation and no key access."
commands.allow = ["installed_build_record"]

[[permission]]
identifier = "allow-installed-build-chat-warning-status"
description = "Read whether the local installed-build proof now requires a non-blocking chat warning; it rehashes only the recorded executable path and never reads message content, keys, credentials or network state."
commands.allow = ["installed_build_chat_warning_status"]

[[permission]]
identifier = "allow-drop-osl-chat-attachments"
description = "Allow only the trusted main OSL window to add dropped local files to the OSL Chats attachment tray without sending them."
commands.allow = ["drop_osl_chat_attachments"]

[[permission]]
identifier = "allow-list-group-verification-build-entries"
description = "List local group verification rows with member id, two-way state, and unmodified or modified build state."
commands.allow = ["list_group_verification_build_entries"]

[[permission]]
identifier = "allow-read-owner-profile-picture-for-friend"
description = "Read the unlocked owner's encrypted profile-picture record only for a backend-accepted friend; non-friends receive image-absent."
commands.allow = ["read_owner_profile_picture_for_friend"]

[[permission]]
identifier = "allow-create-osl-chat-direct-message-conversation"
description = "Allow only the trusted main OSL window to create one first-party OSL Chat direct-message conversation record with exactly two member ids."
commands.allow = ["create_osl_chat_direct_message_conversation"]

[[permission]]
identifier = "allow-list-osl-chat-conversations"
description = "Allow only the trusted main OSL window to read first-party OSL Chat conversations for the creating member."
commands.allow = ["list_osl_chat_conversations"]

[[permission]]
identifier = "allow-get-live-server-revision-report"
description = "Read the configured live keyserver health metadata; this performs one GET request and sends no identity, token, signature, or request body."
commands.allow = ["get_live_server_revision_report"]

[[permission]]
identifier = "allow-add-osl-chat-reaction"
description = "Allow only the trusted main OSL window to add one bounded emoji reaction from the unlocked identity to one opaque message id in the active first-party OSL Chat."
commands.allow = ["add_osl_chat_reaction"]

[[permission]]
identifier = "allow-remove-osl-chat-reaction"
description = "Allow only the trusted main OSL window to remove one bounded emoji reaction from the unlocked identity on one opaque message id in the active first-party OSL Chat."
commands.allow = ["remove_osl_chat_reaction"]

[[permission]]
identifier = "allow-accept-osl-chat-clipboard-image-attachment"
description = "Allow only the trusted main OSL window to turn one encoded clipboard PNG or JPEG into a bounded local OSL Chat attachment card for the active verified friend scope; never reads paths, text clipboard contents, or provider history."
commands.allow = ["accept_osl_chat_clipboard_image_attachment"]

[[permission]]
identifier = "allow-check-hub-recovery-word-retype"
description = "Allow only the trusted main OSL window to ask for selected recovery word positions and check the words typed for those exact positions without echoing the expected words."
commands.allow = ["check_hub_recovery_word_retype"]

[[permission]]
identifier = "allow-reset-every-setting"
description = "Allow only the trusted main OSL window to restore every safe Settings, Look, Friends, and Behaviour choice to its documented default."
commands.allow = ["reset_every_setting"]

[[permission]]
identifier = "allow-get-hub-new-friend-defaults"
description = "Read the four independently validated new-friend defaults and any field-specific repair prompt from encrypted device-local state."
commands.allow = ["get_hub_new_friend_defaults"]

[[permission]]
identifier = "allow-save-hub-new-friend-defaults"
description = "Validate and save all four new-friend defaults to encrypted device-local state."
commands.allow = ["save_hub_new_friend_defaults"]
