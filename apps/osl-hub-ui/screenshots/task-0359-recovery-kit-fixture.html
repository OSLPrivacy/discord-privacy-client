<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSL Privacy - TASK 0359</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #10151d; color: #eef4ff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: 720px; padding: 48px 56px; border: 1px solid #314158; border-radius: 18px; background: #17202d; box-shadow: 0 24px 70px #05080d99; }
      h1 { margin: 0 0 12px; font-size: 34px; } p { color: #b9c7da; } .details { margin: 24px 0; padding: 18px; border: 1px solid #3b4d67; border-radius: 12px; }
      .phrase { display: block; margin: 10px 0; padding: 13px; border-radius: 8px; background: #0e141d; color: #b9e7ff; letter-spacing: .04em; }
      .actions { display: flex; gap: 14px; align-items: center; margin-top: 24px; } button { border: 0; border-radius: 8px; padding: 13px 18px; font: inherit; color: #08111b; background: #83d8ff; } button.secondary { color: #eef4ff; background: #2b3b51; } label { color: #dbe6f4; }
    </style>
  </head>
  <body>
    <main aria-labelledby="route-heading">
      <h1 id="route-heading">Save your recovery kit</h1>
      <p>Keep these details somewhere safe. OSL cannot recover them for you.</p>
      <section class="details" aria-label="Account details">
        <strong>Account details</strong>
        <span class="phrase">Identity phrase · amber cabin delta frost harbor ivory</span>
        <span class="phrase">Password phrase · atlas broom cedar dusk ember flint</span>
      </section>
      <div class="actions">
        <button class="secondary" type="button" aria-label="Copy recovery kit">Copy</button>
        <label><input id="recovery-saved" type="checkbox" checked /> Saved my recovery kit ✓</label>
        <button type="button">Continue</button>
      </div>
      <p aria-label="Word retype">Retype the requested words from the recovery kit you saved.</p>
    </main>
  </body>
</html>
