<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSL unlisted-place Linux fixture</title>
    <style>
      :root { --ground: #080c0d; --cyan: #2ac0f0; --safe: #3dd68c; --timer: #f0b429; --warning: #f0a93a; --pro: #a79bff; --danger: #e05656; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: var(--ground); color: white; }
      body { min-height: 100vh; display: grid; place-items: center; font-family: Consolas, monospace; }
      main { width: 720px; min-height: 420px; padding: 44px; border: 1px solid var(--cyan); border-radius: 3px; }
      .status { margin: 0 0 28px; color: var(--warning); font-family: Consolas, monospace; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
      p { max-width: 520px; margin: 0; color: white; font-size: 16px; line-height: 1.6; }
      .silence { margin-top: 38px; padding: 16px; border: 1px solid var(--warning); border-radius: 2px; color: var(--warning); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title" data-fixture="unlisted">
      <p class="status" role="status">Linux / unlisted place</p>
      <h1 id="fixture-title">No OSL controls here</h1>
      <p>This place is not on the allowed list. OSL leaves this window without privacy controls.</p>
      <p class="silence">Outside-list silence confirmed</p>
    </main>
  </body>
</html>
