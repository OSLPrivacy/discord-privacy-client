<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSL friend actions</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101827; color: #eef2ff; }
    * { box-sizing: border-box; }
    body { min-width: 900px; min-height: 700px; margin: 0; background: radial-gradient(circle at 50% 0%, #26385a, #101827 64%); }
    main { width: 900px; min-height: 700px; padding: 38px 92px; display: grid; place-items: center; }
    .friend-page-shell { width: 616px; padding: 24px; border: 1px solid #415477; border-radius: 18px; background: #172238; box-shadow: 0 24px 70px #05091299; }
    .friend-page-shell > p { margin: 0 0 18px; color: #aebbd5; font-size: 14px; line-height: 1.45; }
    .friend-page-actions { margin: 0; }
    .friend-page-actions > header { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .friend-page-picture, .friend-page-picture > * { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; object-fit: cover; }
    .friend-page-picture > * { font-weight: 700; color: #06131c; }
    .friend-page-actions strong { display: block; overflow-wrap: anywhere; font-size: 18px; }
    .friend-page-tick { margin-left: 7px; color: #4fd2a5; font-weight: 800; }
    .friend-page-action-list { margin-top: 22px; padding-top: 18px; border-top: 1px solid #415477; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .friend-page-action-list .button { width: 100%; }
    .friend-page-action-list .warning { grid-column: 1 / -1; margin: 2px 0; font-size: 13px; line-height: 1.45; }
    .friend-page-action-list .danger { grid-column: span 1; }
  </style>
</head>
<body>
  <main>
    <section class="friend-page-shell" aria-labelledby="friend-page-heading">
      <p id="friend-page-heading">Friend settings</p>
      <div id="friend-page-root"></div>
    </section>
  </main>
  <script type="module">
    import "../src/styles.css";
    import { acceptedFriendPageActionsMarkup } from "../src/friend-page-actions.ts";
    import { friendPictureMarkup } from "../src/friend-picture.ts";

    document.querySelector("#friend-page-root").innerHTML = acceptedFriendPageActionsMarkup({
      personId: "hub-person-task-0272",
      name: "Ada Lovelace",
      pictureMarkup: friendPictureMarkup({ picture: null, fallbackLetter: "A", fallbackColour: "#5eead4" }),
      accepted: true,
    });
  </script>
</body>
</html>
