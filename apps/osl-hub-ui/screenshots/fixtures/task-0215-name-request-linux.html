<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSL name request</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      body { display: grid; place-items: center; padding: 48px; overflow: auto; }
      .task-0215-shell { width: min(100%, 760px); padding: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
      .task-0215-shell > header { margin-bottom: 24px; }
      .task-0215-shell > header p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
      .add-friend-name-request { display: grid; gap: 14px; }
      .add-friend-name-request h2 { margin: 0; font-size: 22px; line-height: 1.2; }
      .add-friend-name-request label { display: grid; gap: 7px; color: var(--text); font-size: 14px; font-weight: 650; }
      .add-friend-name-request label span { color: var(--muted); font-size: 13px; }
      .add-friend-name-request input { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid #52616d; border-radius: var(--radius); outline: 0; background: #0d1317; color: var(--text); font: inherit; }
      .add-friend-name-request input::placeholder { color: #aab5bd; opacity: 1; }
      .add-friend-name-request input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash); }
      .add-friend-name-request .button { width: max-content; min-height: 42px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; cursor: pointer; }
      .add-friend-name-request .form-status { min-height: 20px; margin: 0; color: var(--muted); font-size: 13px; }
      .pending-name-request-result { padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); }
      .pending-name-request-result strong { display: block; color: var(--text); font-size: 14px; }
      .pending-name-request-result .empty-state { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      .pending-name-request-list { margin: 8px 0 0; padding-left: 20px; color: var(--success); font-size: 13px; }
      .pending-name-request-list li::marker { color: var(--brand); }
    </style>
  </head>
  <body>
    <main class="task-0215-shell" aria-label="OSL Friends request fixture">
      <header>
        <strong>OSL Friends</strong>
        <p>Send a private request using a person’s exact OSL name.</p>
      </header>
      <div id="request-fixture"></div>
    </main>
    <script type="module">
      import {
        addFriendNameRequestMarkup,
        blankAddFriendNameRequestModel,
        submitAddFriendNameRequest,
      } from "/src/add-friend-name-request.ts";

      const knownName = "maple_0213";
      let requestNumber = 0;
      let model = blankAddFriendNameRequestModel();
      const backend = {
        newRequestId: () => `task-0215-request-${++requestNumber}`,
        invoke: async (_command, { recipientName }) => {
          if (recipientName !== knownName) throw new Error("OSL: unknown OSL name");
          return { recipient_name: recipientName };
        },
      };
      const root = document.querySelector("#request-fixture");

      function render() {
        root.innerHTML = addFriendNameRequestMarkup(model);
        const input = root.querySelector("[data-add-friend-name]");
        root.querySelector("[data-send-name-request]").addEventListener("click", async () => {
          const name = input.value;
          model = await submitAddFriendNameRequest(model, name, backend);
          render();
        });
      }

      render();
      window.__task0215 = { knownName };
    </script>
  </body>
</html>
