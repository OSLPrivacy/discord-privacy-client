<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSL shared email overlay fixture</title>
    <script type="module">
      import "../src/styles.css";
      import {
        emailProtectedOverlayMarkup,
        initialEmailProtectedOverlayFixtureState,
      } from "../src/email-protected-overlay.ts";

      // ?state=empty renders the app shell with neither overlay present, so
      // TASK 1228's capture has something honest to diff the built screen
      // against. Anything else (including no query at all) renders both.
      const requestedState = new URLSearchParams(location.search).get("state");
      const app = document.querySelector("#app");
      if (requestedState === "empty") {
        app.innerHTML = `<div class="app-frame"><div class="email-overlay-stage"></div></div>`;
      } else {
        const state = initialEmailProtectedOverlayFixtureState();
        app.innerHTML = `<div class="app-frame">${emailProtectedOverlayMarkup(state)}</div>`;
      }
      document.documentElement.dataset.fixtureReady = "email-protected-overlay";
      document.documentElement.dataset.fixtureState = requestedState === "empty" ? "empty" : "built";
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080c0d;
      }
      #app,
      .app-frame {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
