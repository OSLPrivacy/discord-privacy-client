<!doctype html>
<html lang="en" data-fixture-os="linux">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSL Privacy — Incoming request</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #101316;
        color: #f7faf8;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { background: radial-gradient(circle at 18% 3%, #263236 0, #101316 45%); }
      #app { min-height: 640px; display: grid; place-items: center; padding: 36px; }
      .linux-window {
        width: 760px;
        overflow: hidden;
        border: 1px solid #3b484d;
        border-radius: 14px;
        background: #182024;
        box-shadow: 0 24px 64px rgb(0 0 0 / 42%);
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 42px;
        padding: 0 18px;
        border-bottom: 1px solid #344247;
        background: #202b30;
        color: #bcc9c9;
        font-size: 13px;
      }
      .titlebar strong { color: #fbfffd; letter-spacing: .02em; }
      main { padding: 38px 48px 46px; }
      .eyebrow { margin: 0 0 8px; color: #84d7b4; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 29px; letter-spacing: -.025em; }
      .intro { margin: 10px 0 28px; color: #bdc8c8; font-size: 16px; line-height: 1.5; }
      .tabs { display: flex; gap: 8px; margin: 0 0 14px; border-bottom: 1px solid #344247; }
      .tab {
        padding: 10px 14px 11px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: #aab8b8;
        font: inherit;
        font-weight: 650;
      }
      .tab[aria-selected="true"] { border-bottom-color: #6de0ad; color: #f7faf8; }
      .request-card {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) auto;
        align-items: center;
        gap: 17px;
        padding: 22px;
        border: 1px solid #43555b;
        border-radius: 12px;
        background: #222d32;
      }
      .avatar {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 50%;
        background: #2f8266;
        color: white;
        font-weight: 800;
      }
      .request-copy strong { display: block; font-size: 18px; }
      .request-copy span { display: block; margin-top: 4px; color: #b9c6c6; font-size: 14px; }
      .request-actions { display: flex; gap: 10px; }
      .request-action {
        min-width: 92px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid #6de0ad;
        border-radius: 8px;
        background: #6de0ad;
        color: #10221b;
        font: inherit;
        font-weight: 800;
      }
      .request-action.decline { border-color: #637176; background: transparent; color: #f4f7f6; }
      .request-action:focus-visible, .tab:focus-visible { outline: 3px solid #f8cb62; outline-offset: 3px; }
      .footer-note { margin: 20px 0 0; color: #93a3a3; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Fixed fixture data copied from gate 0228's incoming-request model.
      const request = Object.freeze({ id: "REQ-0228", alias: "Pat", discordId: "900000000000022801" });
      document.querySelector("#app").innerHTML = `
        <section class="linux-window" aria-label="OSL Linux incoming request fixture">
          <header class="titlebar"><strong>OSL Privacy</strong><span>Linux · Requests</span></header>
          <main aria-labelledby="requests-title">
            <p class="eyebrow">Friend requests</p>
            <h1 id="requests-title">Incoming request</h1>
            <p class="intro">Review who wants to connect before adding them to your trusted people.</p>
            <nav class="tabs" role="tablist" aria-label="Requests">
              <button class="tab" type="button" role="tab" aria-selected="true">Pending (1)</button>
              <button class="tab" type="button" role="tab" aria-selected="false">All (0)</button>
            </nav>
            <article class="request-card" data-request-id="${request.id}" aria-label="Request from ${request.alias}">
              <span class="avatar" aria-hidden="true">P</span>
              <div class="request-copy"><strong>${request.alias}</strong><span>Wants to be friends</span></div>
              <div class="request-actions" role="group" aria-label="Actions for request from ${request.alias}">
                <button class="request-action" type="button" data-request-action="accept" data-request-id="${request.id}">Accept</button>
                <button class="request-action decline" type="button" data-request-action="decline" data-request-id="${request.id}">Decline</button>
              </div>
            </article>
            <p class="footer-note">Choose an action to resolve this request.</p>
          </main>
        </section>`;
      document.documentElement.dataset.task0229 = "ready";
    </script>
  </body>
</html>
