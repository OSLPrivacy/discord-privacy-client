<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>OSL Privacy - TASK 1310 direct message list</title>
    <link rel="stylesheet" href="../../src/styles.css" />
    <style>
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
      .task-1310-frame { width: 1280px; height: 800px; padding: 24px; box-sizing: border-box; display: grid; place-items: start center; }
      .task-1310-panel { width: 288px; border: 1px solid var(--line); background: var(--bg); }
      .task-1310-panel > header { min-height: 56px; padding: 0 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
      .task-1310-panel > header h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    </style>
  </head>
  <body>
    <div class="task-1310-frame">
      <div class="task-1310-panel">
        <header><h1>Direct messages</h1></header>
        <div class="osl-chat-dm-list-shell"><ul class="osl-chat-dm-list" aria-label="Direct messages"><li class="osl-chat-dm-item is-active has-build-warning" data-osl-chat-dm-item="dm-ava-1310" data-osl-chat-dm-kind="direct-message" data-osl-chat-dm-build="changed">
    <button class="osl-chat-dm-open" type="button" data-osl-chat-dm-open="dm-ava-1310" aria-current="true">
      <span class="osl-chat-avatar" aria-hidden="true">AL</span><span class="osl-chat-dm-copy"><span class="osl-chat-dm-line"><strong class="osl-chat-dm-name">Ava Lindqvist</strong><time class="osl-chat-dm-time">09:14</time></span><span class="osl-chat-dm-latest" data-osl-chat-dm-latest-direction="incoming"><span class="osl-chat-dm-latest-speaker">Ava Lindqvist:</span> Sending you the cabin photos tonight.</span></span><span class="osl-chat-kind" title="Direct message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17.5 3.5 20v-5.2A8 8 0 0 1 3 12c0-4.4 4-8 9-8s9 3.6 9 8-4 8-9 8a10 10 0 0 1-5-1.5Z"/></svg></span><span class="osl-chat-dm-unread" data-osl-chat-dm-unread="2" aria-label="2 unread">2</span>
    </button>
    <p class="osl-chat-dm-build-warning warning" role="status" data-osl-chat-dm-build-warning="changed" data-message-sending-available="true"><strong>Changed build warning</strong><small>OSL build changed after its startup proof. Sending stays available.</small></p>
  </li></ul></div>
      </div>
    </div>
  </body>
</html>
