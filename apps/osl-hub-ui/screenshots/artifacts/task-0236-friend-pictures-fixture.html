<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TASK 0236 Friend Pictures and Fallbacks Fixture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .friend-list-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .friend-list-header {
      background: #f9f9f9;
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .friend-list-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .friend-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .friend-row:last-child {
      border-bottom: none;
    }
    .friend-picture {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .friend-picture-fallback {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 20px;
      color: white;
      flex-shrink: 0;
    }
    .friend-info {
      flex: 1;
      min-width: 0;
    }
    .friend-name {
      font-weight: 600;
      font-size: 14px;
      margin: 0 0 4px 0;
    }
    .friend-status {
      font-size: 13px;
      color: #666;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="friend-list-container">
    <div class="friend-list-header">
      <h2>Friends</h2>
    </div>

    <!-- Friend with picture -->
    <div class="friend-row">
      <img class="friend-picture" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%2306b6d4'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='0.3em' font-size='24' font-weight='bold' fill='white' font-family='Arial'%3EA%3C/text%3E%3C/svg%3E" alt="Alice's picture"/>
      <div class="friend-info">
        <p class="friend-name">Alice</p>
        <p class="friend-status">Verified</p>
      </div>
    </div>

    <!-- Friend with fallback (no picture) -->
    <div class="friend-row">
      <span class="friend-picture-fallback" style="background-color: #14b8a6">M</span>
      <div class="friend-info">
        <p class="friend-name">Marcus</p>
        <p class="friend-status">Needs review</p>
      </div>
    </div>
  </div>
</body>
</html>
