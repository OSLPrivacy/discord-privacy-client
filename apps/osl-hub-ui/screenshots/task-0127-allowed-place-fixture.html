<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSL allowed-place Linux fixture</title>
    <style>
      :root { --ground: #080c0d; --cyan: #2ac0f0; --safe: #3dd68c; --timer: #f0b429; --warning: #f0a93a; --pro: #a79bff; --danger: #e05656; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: var(--ground); color: white; }
      body { min-height: 100vh; display: grid; place-items: center; font-family: Consolas, monospace; }
      main { width: 720px; min-height: 420px; padding: 44px; border: 1px solid var(--cyan); border-radius: 3px; }
      .status { margin: 0 0 28px; color: var(--safe); font-family: Consolas, monospace; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
      p { max-width: 520px; margin: 0; color: white; font-size: 16px; line-height: 1.6; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; }
      button { min-width: 184px; min-height: 44px; padding: 0 16px; border: 1px solid var(--cyan); border-radius: 2px; background: transparent; color: var(--cyan); font: 700 14px/1 Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
      button[data-tone="safe"] { border-color: var(--safe); color: var(--safe); }
      button[data-tone="timer"] { border-color: var(--timer); color: var(--timer); }
      .footer { margin-top: 38px; color: var(--warning); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title" data-fixture="allowed">
      <p class="status" role="status">Linux / allowed place</p>
      <h1 id="fixture-title">Privacy controls available</h1>
      <p>This verified place is on the allowed list. OSL controls are available in this window.</p>
      <div class="controls" aria-label="OSL privacy controls">
        <button data-osl-control="protect" type="button">Protect draft</button>
        <button data-osl-control="transcript" data-tone="safe" type="button">Show transcript</button>
        <button data-osl-control="timer" data-tone="timer" type="button">Set timer</button>
      </div>
      <p class="footer">Allowed list verified</p>
    </main>
  </body>
</html>
