<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/account-screen.css" />
    <title>OSL Privacy - TASK 3734</title>
  </head>
  <body class="account-screen-stage">
    <div id="app"></div>
    <script type="module">
      const { attachAccountScreen } = await import("/src/account-screen.ts");
      const { ACCOUNT_SCREEN_SECRETS, ACCOUNT_SCREEN_SETTINGS } = await import(
        "/src/account-screen-data.ts"
      );

      const event = new URLSearchParams(location.search).get("event");
      if (event !== "refund" && event !== "chargeback") {
        throw new Error(`Unsupported TASK 3734 event: ${event}`);
      }

      window.oslContactSupportEvents = [];
      window.oslClosedBuyerNotices = [];
      attachAccountScreen(
        document.querySelector("#app"),
        ACCOUNT_SCREEN_SECRETS,
        ACCOUNT_SCREEN_SETTINGS,
        {
          buyerNoticeEvent: event,
          onContactSupport: (eventName) => window.oslContactSupportEvents.push(eventName),
          onCloseBuyerNotice: (eventName) => window.oslClosedBuyerNotices.push(eventName),
        },
      );
      document.documentElement.dataset.task3734 = event;
    </script>
  </body>
</html>
