[package]
name = "task-5200-exporter-proof"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "osl_privacy_hub"
path = "src/lib.rs"

[[bin]]
name = "task_5200_generate_fixture"
path = "../../apps/osl-hub/examples/task_5200_generate_fixture.rs"

[[test]]
name = "task_5200_account_export"
path = "../../apps/osl-hub/tests/task_5200_account_export.rs"

[dependencies]
base64 = "=0.22.1"
crypto = { path = "../../crates/crypto" }
hex = "=0.4.3"
rand = "=0.8.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.26.0"
zeroize = "=1.9.0"

[workspace]
