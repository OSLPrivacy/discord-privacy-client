[package]
name = "task-5102-carrier-reference"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
ed25519-dalek = "=2.2.0"
png = "=0.17.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
zeroize = "=1.8.2"

[dev-dependencies]
tempfile = "=3.13.0"

[[bin]]
name = "carrier-reference-fixture"
path = "src/bin/carrier_reference_fixture.rs"

[[bin]]
name = "carrier-baseline-review-fixture"
path = "src/bin/carrier_baseline_review_fixture.rs"

[workspace]
resolver = "2"
