[package]
name = "story-privacy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Sealing for the at-rest ledgers and the per-story content keys. Burn is key
# destruction, so the content key must be a real AEAD key, never a flag.
crypto = { path = "../crypto" }
# The only supported capture-protection primitive lives here
# (`SetWindowDisplayAffinity` / `WDA_EXCLUDEFROMCAPTURE`). The shield setting
# reads its availability from that crate and never from a build constant of its
# own, so an unsupported platform cannot be talked into a protection claim.
runtime = { path = "../runtime" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = "=3.13"

[[bin]]
name = "task-6860-story-privacy"
path = "src/bin/task_6860_story_privacy.rs"
