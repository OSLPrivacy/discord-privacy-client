[package]
name = "store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# AEAD seal/unseal + HKDF key derivation come from the audited
# crypto crate. The store layer holds no novel crypto — it
# composes the same XChaCha20-Poly1305 + HKDF-SHA256 primitives
# the keystore sealers use internally.
crypto = { path = "../crypto" }

# `bundled` compiles SQLite from source so we don't depend on the
# host's libsqlite3 — necessary for the `x86_64-pc-windows-gnu`
# cross build that lacks system SQLite. Bundled SQLite is built
# with FTS5 enabled by default (SQLITE_ENABLE_FTS5=1).
rusqlite = { version = "0.32", features = ["bundled"] }

thiserror = { workspace = true }

# TASK 4657: the post/story/archive record binds TASK 4651's four frozen
# visibility stable IDs. They are read from the shipping settings crate rather
# than re-declared here, so the product has one visibility vocabulary and not
# two that can drift apart.
content-defaults = { path = "../content-defaults" }

# TASK 4657: the independent body/media digest carried by every social record.
# Independent of the AEAD tag on purpose — the tag proves the row was not
# altered on disk, the digest proves the bytes the author signed are the bytes
# that came back.
sha2 = { workspace = true }

[dev-dependencies]
# The v3 fixture in `tests/blind_index_test.rs` must seal rows the way the
# *old* build did, not the way the current one does. Lifting sealed bytes out
# of a store built from current code produces a fixture that silently follows
# whatever the code happens to do, so it cannot detect a change to the AAD —
# which is precisely the migration bug it exists to catch. Reaching for the
# audited primitives directly makes the fixture independent of the crate.
crypto = { path = "../crypto" }
# Pinned to 3.13 to match the rest of the workspace (later 3.x
# pulls a getrandom requiring edition-2024 / rustc 1.85+ which
# is past our MSRV).
tempfile = "=3.13"
# TASK 4657's check hashes its own preimage rather than calling the store's
# helper, so a production module that changed how it hashes cannot drag the
# control along with it.
sha2 = { workspace = true }

# TASK 4657. `harness = false` so a starved production path exits 1 by content,
# field and byte offset — a libtest binary exits 101 and cargo wraps it, which
# is not the exit code the finish line names.
[[test]]
name = "task_4657_social_records"
harness = false

# TASK 4658. Same reason: a starved distribution path has to exit 1 by option,
# content type, viewer and byte offset, and it must never panic its way to 101.
[[test]]
name = "task_4658_fetch_rule"
harness = false
