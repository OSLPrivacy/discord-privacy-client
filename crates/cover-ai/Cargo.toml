[package]
name = "cover-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The crate's package name is `osl-cover-draft`; keep the local alias
# `cover_draft` so `use cover_draft::...` call sites stay valid.
cover-draft = { path = "../cover-draft", package = "osl-cover-draft" }
encoding_rs.workspace = true
rand.workspace = true
llama_cpp_2 = { package = "llama-cpp-2", version = "=0.1.153", default-features = false, features = ["openmp"], optional = true }
llama_cpp_sys_2 = { package = "llama-cpp-sys-2", version = "=0.1.153", optional = true }
zeroize.workspace = true

[features]
default = []
local-model = ["dep:llama_cpp_2", "dep:llama_cpp_sys_2"]

[dev-dependencies]
trybuild = "1"
sha2.workspace = true
tempfile = "=3.13"
# tests/coupling_is_deterministic.rs imports stego; without this the test target
# failed to compile and took the whole `cargo test --workspace` run down with it.
stego = { path = "../stego" }
