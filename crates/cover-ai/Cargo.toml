[package]
name = "cover-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cover-draft = { path = "../cover-draft" }
encoding_rs.workspace = true
# The adapter reads raw logits directly; it needs neither llama.cpp's sampler
# nor the optional `common` helper library used for grammar support.
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["openmp"] }
zeroize.workspace = true
