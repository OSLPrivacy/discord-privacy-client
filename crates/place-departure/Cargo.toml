[package]
name = "place-departure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Departure is key work, not list work: the group path rotates a real
# sender-key chain and the enclave path re-keys real channel keys and
# re-wraps them per remaining member with ML-KEM. All of that lives here.
crypto = { path = "../crypto" }
# The signed self-removal event, its epoch ladder and its actor/subject
# invariant already ship in `ipc::space_roster`. Departure reuses that type
# rather than inventing a second membership-event format.
ipc = { path = "../ipc" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = "=3.13"

[[bin]]
name = "task-6818-place-departure"
path = "src/bin/task_6818_place_departure.rs"
