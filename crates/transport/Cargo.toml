[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Tor support belongs in this crate. It will supervise an Arti SOCKS5
# subprocess rather than embed `arti-client`, because embedding requires Rust
# 1.91 and edition 2024 while the workspace is pinned to Rust 1.88 and edition
# 2021. See README.md for the T1-70 integration boundary.

[features]
default = []
