[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }

# Tor support belongs in this crate. It supervises an Arti SOCKS5 subprocess
# rather than embedding `arti-client`, because embedding requires Rust 1.91
# and edition 2024 while the workspace is pinned to Rust 1.88 and edition
# 2021. See README.md for the T1-70 integration boundary.

[features]
default = []
