[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keystore = { path = "../keystore" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }

# Tor support belongs in this crate. It supervises OSL's bundled Tor sidecar,
# reads the sidecar-owned ephemeral SOCKS address from its JSON status stream,
# and gives callers only a client pinned to that address.

[features]
default = []
