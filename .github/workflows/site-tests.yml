name: Website Evidence Tests

on:
  push:
    # D-172 decided NOT to add `integrate/**` here. Reasons, in order:
    # (1) every check in this job is about the public WEBSITE, which deploys
    #     from `main`; the integration branch is where the desktop app is
    #     assembled and does not change what the site serves.
    # (2) it is red today -- `node scripts/check-a11y.mjs` reports 6 blocking
    #     horizontal-overflow findings on /docs/compare, /docs/download and
    #     /docs/faq at 320px and 390px @200% zoom (measured 2026-08-04).
    # Reason (2) alone would NOT be grounds to leave it off, so it is not left
    # unwatched: the exact count is pinned in scripts/ci/quarantine.json and
    # graded on every push to integrate/** by the quarantine-ratchet job in
    # integration-gate.yml. It can go down. It cannot go up.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check accessibility matrix
        run: node scripts/check-a11y.mjs
      - name: Check build identity contract
        run: node scripts/test-build-identity.mjs
      - name: Test deterministic website screenshot matrix controls
        run: node --test scripts/screenshot-matrix.test.mjs
