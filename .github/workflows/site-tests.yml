name: Website Evidence Tests

on:
  push:
    # D-172 decided NOT to add `integrate/**` here. Reasons, in order:
    # (1) every check in this job is about the public WEBSITE, which deploys
    #     from `main`; the integration branch is where the desktop app is
    #     assembled and does not change what the site serves.
    # (2) it is red today -- `node scripts/check-a11y.mjs` reports 6 blocking
    #     horizontal-overflow findings on /docs/compare, /docs/download and
    #     /docs/faq at 320px and 390px @200% zoom (measured 2026-08-04).
    # Reason (2) alone would NOT be grounds to leave it off, so it is not left
    # unwatched. D-193 correction: when this comment was written the a11y check
    # was in quarantine.json's `notRatcheted` list, which meant it was excluded
    # from the ratchet AND executed by nothing -- so "graded on every push"
    # was not true of it. It is now a real entry: `node scripts/check-a11y.mjs`
    # is RUN by the quarantine-ratchet job of integration-gate.yml on every push
    # to integrate/**, and graded against the SET of page/width/zoom identities,
    # recorded per environment because the pixel measurement depends on the
    # installed font stack. A finding can go away. One cannot arrive.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check accessibility matrix
        run: node scripts/check-a11y.mjs
      - name: Check build identity contract
        run: node scripts/test-build-identity.mjs
      - name: Test deterministic website screenshot matrix controls
        run: node --test scripts/screenshot-matrix.test.mjs
