name: Website Claims

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website-claim-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every public website claim
        run: node scripts/check-claims.mjs

  website-claim-gate-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove the website claim gate rejects its sabotage fixtures
        run: node scripts/check-claims.mjs --self-test
