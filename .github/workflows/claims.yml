name: Website Claims

on:
  push:
    # D-172. Same as state-authority.yml: this file is not on the default branch,
    # so it had never run anywhere. Both of its jobs are green on
    # integrate/first-usable (measured 2026-08-04) and the self-test job proves
    # the claim gate rejects its sabotage fixtures, so it is a gate that can
    # fail. Switched on.
    branches: [main, 'integration/**']
  pull_request:
  # D-195: the only trigger a commit message cannot suppress. `[skip ci]` in a
  # commit subject cancels `push` and `pull_request` outright; see the ruling in
  # integration-gate.yml. This makes a skipped run re-gradable by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-claim-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every public website claim
        run: node scripts/check-claims.mjs

  website-claim-gate-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prove the website claim gate rejects its sabotage fixtures
        run: node scripts/check-claims.mjs --self-test
