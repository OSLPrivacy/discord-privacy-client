name: Public release audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # D-172 decided NOT to add `integrate/**` here. It audits what a PUBLIC
    # RELEASE may claim, and releases are cut from tags off `main`; running it
    # per-push on an integration branch asks a release question of something
    # that is not a release yet.
    # It is also red today: `python3 scripts/audit_public_release.py` reports 18
    # tracked files carrying a personal WSL path (measured 2026-08-04, green on
    # main at run 30658453416 on 2026-07-31 -- so all 18 arrived on
    # integrate/first-usable in the four days nothing was watching it).
    # Not left unwatched: the count is pinned in scripts/ci/quarantine.json and
    # graded on every push to integrate/** by integration-gate.yml.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python3 scripts/audit_reproducible_build.py --self-test
      - run: python3 scripts/audit_reproducible_build.py
      - run: python3 scripts/audit_public_release.py
