name: Reproducible Build

on:
  push:
    branches:
      - main
    tags:
      - "hub-v*"
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "hub-v* release tag to reproduce; defaults to the newest published hub-v* release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  reproduce-hub-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0

      - name: Resolve exact release source
        id: source
        shell: pwsh
        env:
          INPUT_CANDIDATE_TAG: ${{ inputs.candidate_tag || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidateTag = ([string]$env:INPUT_CANDIDATE_TAG).Trim()
          if ([string]::IsNullOrWhiteSpace($candidateTag) -and "${{ github.ref }}" -like "refs/tags/hub-v*") {
            $candidateTag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($candidateTag)) {
            # Nothing named a tag, so reproduce the newest installer users can
            # actually download. The version in apps/osl-hub/tauri.conf.json runs
            # ahead of the newest release while main is developed, so it is not by
            # itself evidence that anything was ever shipped under that tag.
            $listedLines = gh release list --limit 200 --json tagName,isDraft,publishedAt
            if ($LASTEXITCODE -ne 0) {
              throw "could not enumerate published releases"
            }
            $listed = ($listedLines | Out-String).Trim()
            if ([string]::IsNullOrWhiteSpace($listed)) {
              $listed = "[]"
            }
            $published = @(
              $listed | ConvertFrom-Json |
                Where-Object { -not $_.isDraft -and $_.tagName -cmatch "^hub-v[0-9A-Za-z.+-]{1,64}$" } |
                Sort-Object { [datetime]$_.publishedAt } -Descending
            )
            if ($published.Count -gt 0) {
              $candidateTag = $published[0].tagName
            }
          }
          if ([string]::IsNullOrWhiteSpace($candidateTag)) {
            # No published installer exists, so there are no released bytes to
            # compare against. The next step must prove that independently; every
            # byte comparison below stays mandatory the moment a release exists.
            "has_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "no published hub-v* release resolved"
            exit 0
          }
          if ($candidateTag -notmatch "^hub-v[0-9A-Za-z.+-]{1,64}$") {
            throw "candidate_tag must be a bounded hub-v* tag"
          }

          git fetch --force --tags origin "refs/tags/${candidateTag}:refs/tags/${candidateTag}"
          $tagCommit = (git rev-list -n 1 "$candidateTag^{commit}").Trim()
          if ($tagCommit -notmatch "^[0-9a-f]{40}$") {
            throw "candidate tag does not resolve to an exact commit"
          }
          git checkout --detach $tagCommit

          $config = Get-Content apps/osl-hub/tauri.conf.json | ConvertFrom-Json
          $expectedTag = "hub-v$($config.version)"
          if ($candidateTag -cne $expectedTag) {
            throw "candidate tag $candidateTag does not match source version $expectedTag"
          }
          $tree = (git rev-parse "$tagCommit^{tree}").Trim()
          if ($tree -notmatch "^[0-9a-f]{40}$") {
            throw "candidate source tree did not resolve"
          }
          $release = gh release view $candidateTag --json tagName --jq .tagName
          if ($release.Trim() -cne $candidateTag) {
            throw "GitHub release is not bound to the requested tag"
          }

          "has_release=true" >> $env:GITHUB_OUTPUT
          "candidate_tag=$candidateTag" >> $env:GITHUB_OUTPUT
          "source_commit=$tagCommit" >> $env:GITHUB_OUTPUT
          "source_tree=$tree" >> $env:GITHUB_OUTPUT

      - name: Prove no released installer exists to reproduce
        if: steps.source.outputs.has_release != 'true'
        shell: pwsh
        env:
          INPUT_CANDIDATE_TAG: ${{ inputs.candidate_tag || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $listedLines = gh release list --limit 200 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) {
            throw "could not enumerate releases while proving nothing has shipped"
          }
          $listed = ($listedLines | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($listed)) {
            $listed = "[]"
          }
          $published = @(
            $listed | ConvertFrom-Json |
              Where-Object { -not $_.isDraft -and $_.tagName -cmatch "^hub-v[0-9A-Za-z.+-]{1,64}$" }
          )
          if ($published.Count -ne 0) {
            throw "published hub-v* releases exist and must be reproduced: $(($published | ForEach-Object { $_.tagName }) -join ', ')"
          }
          if ("${{ github.ref }}" -like "refs/tags/hub-v*") {
            throw "a hub-v* tag was pushed, so its released installer must be reproduced"
          }
          if (-not [string]::IsNullOrWhiteSpace(([string]$env:INPUT_CANDIDATE_TAG).Trim())) {
            throw "an explicit candidate tag was requested, so its released installer must be reproduced"
          }
          $note = "No published hub-v* release exists, so no shipped OSL Privacy installer can be reproduced yet. Reproducibility of the Hub build is therefore still unproven, and stays unproven until the first release is published."
          Write-Host $note
          $note >> $env:GITHUB_STEP_SUMMARY

      - name: Download released installer
        if: steps.source.outputs.has_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path candidate | Out-Null
          gh release download $env:CANDIDATE_TAG --pattern "*.exe" --dir candidate
          $installers = @(Get-ChildItem candidate -File -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "release must contain exactly one Windows installer, got $($installers.Count)"
          }
          "RELEASE_INSTALLER=$($installers[0].FullName)" >> $env:GITHUB_ENV
          "RELEASE_INSTALLER_NAME=$($installers[0].Name)" >> $env:GITHUB_ENV

      - name: Extract released executable bytes
        if: steps.source.outputs.has_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path candidate-extracted | Out-Null
          7z x "$env:RELEASE_INSTALLER" -ocandidate-extracted -y | Out-Null
          $executables = @(Get-ChildItem candidate-extracted -Recurse -File -Filter "osl-privacy-hub.exe")
          if ($executables.Count -ne 1) {
            throw "released installer must contain exactly one OSL Privacy Hub executable, got $($executables.Count)"
          }
          $hash = (Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "RELEASED_EXE=$($executables[0].FullName)" >> $env:GITHUB_ENV
          "RELEASED_EXE_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Build frontend from exact source
        if: steps.source.outputs.has_release == 'true'
        working-directory: apps/osl-hub-ui
        run: |
          npm ci
          npm run build

      - name: Rebuild Hub executable from exact source
        if: steps.source.outputs.has_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The shipped executable is not a bare cargo artifact. osl-hub-release.yml
          # builds it with the Tauri CLI, which adds its own custom-protocol feature
          # and then patches the linked executable with bundle-type information
          # ("Info Patching ... with bundle type information: nsis"). Reproducing the
          # released bytes therefore means running the release command itself, at the
          # release project path, into the release target directory - rustc embeds
          # that absolute path, so relocating the build guarantees a mismatch.
          $target = "apps/osl-hub/target"
          if (Test-Path $target) {
            throw "reproducible build target directory already exists"
          }
          npm install -g @tauri-apps/cli@2.11.4
          # bundle.createUpdaterArtifacts is on, so bundling refuses to run without a
          # signing key. This throwaway key signs only our own updater artifact; it
          # never touches the executable bytes under comparison, and the released
          # signature is verified by the updater policy audit, not by this job.
          $signingKey = Join-Path $env:RUNNER_TEMP "osl-repro-updater.key"
          tauri signer generate --ci -p "" -w $signingKey
          if ($LASTEXITCODE -ne 0) {
            throw "could not generate the throwaway updater signing key"
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = $signingKey
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          Push-Location apps/osl-hub
          try {
            tauri build --features desktop
            if ($LASTEXITCODE -ne 0) {
              throw "the release build command failed on exact source"
            }
          } finally {
            Pop-Location
          }
          # Compare what the installer actually carries. The bundler patches the
          # copy it stages, so the pre-bundle link output at target/release still
          # reads __TAURI_BUNDLE_TYPE_VAR_UNK where the shipped copy reads NSS -
          # measured, three bytes, the only difference between the two.
          $bundles = @(Get-ChildItem apps/osl-hub/target/release/bundle/nsis -File -Filter "*.exe")
          if ($bundles.Count -ne 1) {
            throw "rebuild must produce exactly one Windows installer, got $($bundles.Count)"
          }
          New-Item -ItemType Directory -Path rebuilt-extracted | Out-Null
          7z x "$($bundles[0].FullName)" -orebuilt-extracted -y | Out-Null
          $executables = @(Get-ChildItem rebuilt-extracted -Recurse -File -Filter "osl-privacy-hub.exe")
          if ($executables.Count -ne 1) {
            throw "rebuilt installer must contain exactly one OSL Privacy Hub executable, got $($executables.Count)"
          }
          $rebuilt = $executables[0].FullName
          $hash = (Get-FileHash $rebuilt -Algorithm SHA256).Hash.ToLowerInvariant()
          "REBUILT_EXE=$rebuilt" >> $env:GITHUB_ENV
          "REBUILT_EXE_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Compare released and rebuilt bytes
        if: steps.source.outputs.has_release == 'true'
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASED_EXE_SHA256 -cne $env:REBUILT_EXE_SHA256) {
            throw "released executable bytes do not reproduce from exact source: released sha256=$env:RELEASED_EXE_SHA256 rebuilt sha256=$env:REBUILT_EXE_SHA256"
          }
          $installerHash = (Get-FileHash $env:RELEASE_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof = [ordered]@{
            schemaVersion = 1
            candidateTag = $env:CANDIDATE_TAG
            sourceCommit = $env:SOURCE_COMMIT
            sourceTree = $env:SOURCE_TREE
            installer = [ordered]@{
              name = $env:RELEASE_INSTALLER_NAME
              sha256 = $installerHash
            }
            releasedExecutable = [ordered]@{
              sha256 = $env:RELEASED_EXE_SHA256
            }
            rebuiltExecutable = [ordered]@{
              sha256 = $env:REBUILT_EXE_SHA256
            }
          }
          $proof | ConvertTo-Json -Depth 5 | Set-Content reproducible-build-proof.json -Encoding UTF8

      - name: "success'"
        if: steps.source.outputs.has_release == 'true'
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
        run: |
          $ErrorActionPreference = "Stop"
          $proof = Get-Content reproducible-build-proof.json -Raw | ConvertFrom-Json
          if ($proof.schemaVersion -ne 1) {
            throw "reproducibility proof has unsupported schema"
          }
          $releasedHash = (Get-FileHash $env:RELEASED_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          $rebuiltHash = (Get-FileHash $env:REBUILT_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash $env:RELEASE_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualCommit = (git rev-parse HEAD).Trim()
          $actualTree = (git rev-parse HEAD^{tree}).Trim()
          if ($actualCommit -cne $env:SOURCE_COMMIT -or $actualTree -cne $env:SOURCE_TREE) {
            throw "reproducibility proof was not produced from the resolved exact source"
          }
          if ($proof.candidateTag -cne $env:CANDIDATE_TAG -or
              $proof.sourceCommit -cne $env:SOURCE_COMMIT -or
              $proof.sourceTree -cne $env:SOURCE_TREE) {
            throw "reproducibility proof is not bound to the resolved exact source"
          }
          if ($proof.installer.name -cne $env:RELEASE_INSTALLER_NAME -or
              $proof.installer.sha256 -cne $installerHash) {
            throw "reproducibility proof is not bound to the released installer bytes"
          }
          if ($proof.releasedExecutable.sha256 -cne $releasedHash -or
              $proof.rebuiltExecutable.sha256 -cne $rebuiltHash -or
              $releasedHash -cne $rebuiltHash) {
            throw "released executable bytes do not reproduce from exact source"
          }

      - name: Upload reproducibility proof
        if: steps.source.outputs.has_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-build-proof
          path: reproducible-build-proof.json
