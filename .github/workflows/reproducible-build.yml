name: Reproducible Build

# WHAT SHIPS is apps/osl-hub -> osl-privacy-hub.exe, tagged `hub-v*` and built
# by osl-hub-release.yml. Until 2026-07-26 this workflow triggered on `v*` and
# hashed target/release-deterministic/discord-privacy-client.exe — the legacy
# src-tauri binary, on a tag pattern the release path never uses. It therefore
# proved the reproducibility of an artifact no user receives, and had never run
# on any release. Both the hub and the legacy binary are covered below, and the
# hub is the one that gates a release.
on:
  push:
    tags: ['hub-v*', 'v*']
  workflow_dispatch:

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The Tauri bundle embeds apps/osl-hub-ui/dist at COMPILE time, so a
  # non-deterministic frontend makes a deterministic binary impossible no
  # matter what the Rust profile says. Verified reproducible on 2026-07-26.
  frontend-determinism:
    name: frontend dist is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json
      - name: Build the frontend twice and compare the whole tree
        working-directory: apps/osl-hub-ui
        run: |
          npm ci --no-audit --no-fund
          tree_hash() { find dist -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1; }
          rm -rf dist && npm run build >/dev/null && first="$(tree_hash)"
          rm -rf dist && npm run build >/dev/null && second="$(tree_hash)"
          echo "first:  $first"
          echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::apps/osl-hub-ui/dist is not byte-reproducible; the embedded UI differs between builds" >&2
            exit 1
          fi
          echo "frontend dist tree-hash \`$first\` reproduced exactly." >> "$GITHUB_STEP_SUMMARY"

  # Informational only. Determinism is configured in the hub-binary job, not by
  # this profile - see the note this step prints.
  hub-profile-preflight:
    name: hub deterministic profile note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Require a deterministic profile on the shipped crate
        run: |
          if grep -q '^\[profile\.release-deterministic\]' apps/osl-hub/Cargo.toml; then
            echo "apps/osl-hub declares [profile.release-deterministic]."
            exit 0
          fi
          cat <<'MSG'
          NOTE: apps/osl-hub/Cargo.toml has no [profile.release-deterministic].
          That is no longer a blocker, and this check is deliberately NOT fatal.

          The root profile of that name contains only `inherits = "release"` and a
          comment citing a design document absent from this repository. It pins no
          determinism flags, so adding it here would change nothing while making a
          reproducibility claim look supported. Determinism is configured in the
          hub-binary job instead - codegen-units=1, /Brepro, --remap-path-prefix,
          CARGO_INCREMENTAL=0 - and osl-privacy-hub.exe reproduced exactly on
          2026-07-26 (run 30231394207) with those set and this profile still absent.

          Adding the profile is optional consolidation, not a prerequisite. If it is
          added, move the flags into it and delete them here so there is one source.
          MSG
          exit 0

  hub-binary:
    name: hub binary build ${{ matrix.run }}
    runs-on: windows-latest
    needs: frontend-determinism
    strategy:
      matrix:
        run: [1, 2]   # build twice; compare hashes
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
      - name: Build the embedded frontend first
        working-directory: apps/osl-hub-ui
        # windows-latest defaults to PowerShell, which does NOT stop on a
        # non-zero native exit: the first command here could fail and the
        # step would still pass on the last command's status.
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # DETERMINISM IS CONFIGURED HERE, NOT IN THE PROFILE NAME.
      #
      # `[profile.release-deterministic]` in the root Cargo.toml contains only
      # `inherits = "release"` and a comment pointing at a design document that
      # does not exist in this repository. No workflow pinned RUSTFLAGS,
      # SOURCE_DATE_EPOCH, --remap-path-prefix or /Brepro anywhere. The profile
      # therefore differed from plain `release` in no respect at all, which is
      # exactly why two identical builds produced different hashes on
      # 2026-07-26 (run 30230442447).
      #
      # Setting the levers here rather than in apps/osl-hub/Cargo.toml is
      # deliberate: that manifest is a serialized central file PR #5 also
      # edits, and everything below is measurable from this lane's own files.
      #
      #   codegen-units=1   parallel codegen partitions non-deterministically
      #   /Brepro           the MSVC PE header carries a BUILD TIMESTAMP by
      #                     default; /Brepro replaces it with a content hash
      #   remap-path-prefix stops the runner's absolute path being baked into
      #                     debug info and panic messages
      #   CARGO_INCREMENTAL incremental artefacts carry ordering noise
      #   SOURCE_DATE_EPOCH pins any build script that stamps a time
      - name: Build the shipped binary
        shell: bash
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=.
            -Clink-arg=/Brepro
          CARGO_INCREMENTAL: '0'
          SOURCE_DATE_EPOCH: '1700000000'
        run: |
          if grep -q '^\[profile\.release-deterministic\]' apps/osl-hub/Cargo.toml; then
            profile=release-deterministic
          else
            profile=release
          fi
          echo "profile=$profile" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --manifest-path apps/osl-hub/Cargo.toml \
            --features desktop --bin osl-privacy-hub --profile "$profile" \
            --config "profile.$profile.codegen-units=1" \
            --config "profile.$profile.incremental=false"
      - name: Hash the shipped binary
        shell: bash
        run: |
          sha256sum "apps/osl-hub/target/$profile/osl-privacy-hub.exe" \
            | cut -d' ' -f1 > "hub-hash-${{ matrix.run }}.txt"
          cat "hub-hash-${{ matrix.run }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hub-hash-${{ matrix.run }}
          path: hub-hash-${{ matrix.run }}.txt

  hub-compare:
    name: hub binary is reproducible
    needs: hub-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      - name: Compare the two hub builds
        run: |
          first="$(cat hub-hash-1/hub-hash-1.txt)"
          second="$(cat hub-hash-2/hub-hash-2.txt)"
          echo "build 1: $first"
          echo "build 2: $second"
          {
            echo "### Shipped binary (osl-privacy-hub.exe)"
            echo ""
            echo "- build 1: \`$first\`"
            echo "- build 2: \`$second\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$first" != "$second" ]; then
            echo "::error::osl-privacy-hub.exe is NOT reproducible across two identical builds" >&2
            echo "- **result: NOT reproducible**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- **result: reproduced exactly**" >> "$GITHUB_STEP_SUMMARY"

  # Retained coverage for the legacy src-tauri binary. This is the check that
  # existed before 2026-07-26; it is kept so nothing loses coverage, but it is
  # explicitly NOT the artifact that ships as OSL Privacy.
  legacy-binary:
    name: legacy binary build ${{ matrix.run }}
    runs-on: windows-latest
    strategy:
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
      # src-tauri/tauri.conf.json points frontendDist at ../webview/dist, which
      # is an uncommitted build output, so generate_context!() panics at compile
      # time without it. This is why this job failed on 2026-05-09 and
      # 2026-05-10 and then went unnoticed for 2.5 months: the workflow only
      # fired on `v*` tags that stopped being cut.
      - name: Build the embedded webview frontend first
        working-directory: webview
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Same levers as the hub job. Run 30231394207 is the recorded control:
      # the hub binary WITH these flags reproduced exactly while this legacy
      # binary WITHOUT them did not, which is what shows the flags did it.
      - name: Build deterministic
        shell: bash
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=.
            -Clink-arg=/Brepro
          CARGO_INCREMENTAL: '0'
          SOURCE_DATE_EPOCH: '1700000000'
        run: |
          cargo build --profile release-deterministic \
            --config 'profile.release-deterministic.codegen-units=1' \
            --config 'profile.release-deterministic.incremental=false'
      - name: Hash artifact
        shell: bash
        run: |
          sha256sum target/release-deterministic/discord-privacy-client.exe \
            | cut -d' ' -f1 > "legacy-hash-${{ matrix.run }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hash-${{ matrix.run }}
          path: legacy-hash-${{ matrix.run }}.txt

  legacy-compare:
    name: legacy binary is reproducible
    needs: legacy-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      - name: Compare the two legacy builds
        run: diff legacy-hash-1/legacy-hash-1.txt legacy-hash-2/legacy-hash-2.txt
