name: Build signed OSL Privacy candidate

on:
  push:
    tags:
      - "hub-v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  windows-release:
    # A manually dispatched run is useful for retrying a tagged release, but
    # selecting a branch must never reach signing or mutate hub-latest.
    if: startsWith(github.ref, 'refs/tags/hub-v')
    runs-on: windows-latest
    environment: hub-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0

      - name: Resolve and verify the app release version
        id: hub-version
        shell: pwsh
        run: |
          python scripts/check_version_consistency.py
          $config = Get-Content apps/osl-hub/tauri.conf.json | ConvertFrom-Json
          $tag = "hub-v$($config.version)"
          if ("${{ github.ref }}" -notlike "refs/tags/hub-v*") {
            throw "OSL Privacy releases require a hub-v* tag, not ${{ github.ref }}"
          }
          if ("${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match OSL Privacy version tag $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Build and test trusted OSL Privacy frontend
        working-directory: apps/osl-hub-ui
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Test OSL Privacy core
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features core --lib

      - name: Test OSL Privacy Windows identity lifecycle
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features core --test windows_identity_lifecycle

      - name: Audit OSL Privacy updater supply-chain policy
        run: |
          python scripts/audit_hub_release.py
          python -m unittest scripts/audit_hub_release.py
          python -m unittest scripts/test_verify_hub_vm_qa_attestation.py

      - name: Extract human-written release notes
        id: changelog
        shell: bash
        run: |
          python scripts/extract_changelog_section.py \
            --tag "${{ steps.hub-version.outputs.tag }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reject unvetted public claims in release notes
        shell: bash
        run: |
          python scripts/check_release_notes_claims.py \
            --tag "${{ steps.hub-version.outputs.tag }}"

      - name: Build signed draft installer and updater manifest
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HUB_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.HUB_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/osl-hub
          tagName: hub-v__VERSION__
          releaseName: OSL Privacy __VERSION__
          releaseBody: ${{ steps.changelog.outputs.release_body }}
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: osl-hub-[version]-[arch]-[bundle].[ext]
          args: --features desktop

      # tauri-action uploads a latest.json that names the same artifact twice and points at
      # api.github.com asset URLs, which only resolve for a token-bearing caller. The promotion
      # gate refuses both, so without this step no build can ever be promoted and no installed
      # client could fetch the artifact even if one were. Normalization moves the manifest to
      # what the gate and the client both require; it never relaxes the gate.
      - name: Normalize updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ steps.hub-version.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check cryptography
          mkdir -p candidate
          gh release download "$CANDIDATE_TAG" --pattern latest.json --dir candidate --clobber
          installer_name="$(gh release view "$CANDIDATE_TAG" --json assets \
            --jq '[.assets[].name | select(endswith(".exe"))] | unique | .[0]')"
          test -n "$installer_name"
          python scripts/normalize_updater_manifest.py \
            --manifest candidate/latest.json \
            --tag "$CANDIDATE_TAG" \
            --installer-name "$installer_name"
          gh release upload "$CANDIDATE_TAG" candidate/latest.json --clobber
          # Prove the manifest is one an installed client would accept before it can ever be
          # offered to one: download the artifact the manifest names and verify its minisign
          # signature under the public key compiled into the app.
          gh release download "$CANDIDATE_TAG" --pattern "$installer_name" --dir candidate --clobber
          python scripts/verify_update_feed_acceptance.py \
            --manifest candidate/latest.json \
            --installer "candidate/$installer_name"

      - name: Publish signed release checksums and build-hash manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ steps.hub-version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HUB_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.HUB_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir release-assets
          gh release download "$CANDIDATE_TAG" --dir release-assets --clobber
          npm install --global @tauri-apps/cli@2.11.4
          installer_name="$(find release-assets -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort | head -n 1)"
          test -n "$installer_name"
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          python scripts/build_hash_manifest.py \
            --output release-assets/build-hashes.json \
            --version "${{ steps.hub-version.outputs.version }}" \
            --tag "$CANDIDATE_TAG" \
            --commit "${{ github.sha }}" \
            --installer "release-assets/$installer_name" \
            --sign
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \
            ! -name SHA256SUMS.txt ! -name SHA256SUMS.txt.minisig ! -name build-hashes.json.sig \
            -printf '%f\n' | sort)
          test "${#assets[@]}" -gt 0
          python scripts/publish_release_checksums.py --sign --output release-assets/SHA256SUMS.txt \
            "${assets[@]/#/release-assets/}"
          gh release upload "$CANDIDATE_TAG" release-assets/SHA256SUMS.txt \
            release-assets/SHA256SUMS.txt.minisig \
            release-assets/build-hashes.json release-assets/build-hashes.json.sig --clobber

      # GitHub binds this exact installer digest to this workflow's short-lived OIDC identity
      # and records it in its Sigstore-backed transparency log. The client never queries it.
      - name: Attest installer build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-assets/*.exe
