name: Build signed OSL Privacy candidate

on:
  push:
    tags:
      - "hub-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Frontend tests run here, on Linux, and gate signing. They are pure
  # Node/JSDOM with no Windows-specific code path, and one of them is
  # timer-resolution sensitive in a way the Windows runner cannot satisfy.
  # Signing must not begin until they pass.
  verify:
    name: verify frontend before signing
    if: startsWith(github.ref, 'refs/tags/hub-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json
      - name: OSL Privacy UI gate
        run: bash scripts/ci/node-suite.sh apps/osl-hub-ui typecheck,test,build

  windows-release:
    # A manually dispatched run is useful for retrying a tagged release, but
    # selecting a branch must never reach signing or mutate hub-latest.
    if: startsWith(github.ref, 'refs/tags/hub-v')
    needs: verify
    runs-on: windows-latest
    environment: hub-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0

      - name: Resolve and verify the app release version
        id: hub-version
        shell: pwsh
        run: |
          $config = Get-Content apps/osl-hub/tauri.conf.json | ConvertFrom-Json
          $tag = "hub-v$($config.version)"
          if ("${{ github.ref }}" -notlike "refs/tags/hub-v*") {
            throw "OSL Privacy releases require a hub-v* tag, not ${{ github.ref }}"
          }
          if ("${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match OSL Privacy version tag $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Build only — the frontend TESTS run on Linux in the `verify` job above.
      # Running them here on windows-latest is what would make every signing
      # run fail: apps/osl-hub-ui/src/latest.test.ts asserts a coalescing bound
      # on 2 ms/8 ms setTimeout pacing that Windows' ~15.6 ms timer quantum
      # cannot honour. The dist is still built here, because Tauri embeds it at
      # COMPILE time and a stale dist ships a stale UI.
      - name: Build the trusted OSL Privacy frontend for embedding
        working-directory: apps/osl-hub-ui
        # windows-latest defaults to PowerShell, which does NOT stop on a
        # non-zero native exit: the first command here could fail and the
        # step would still pass on the last command's status.
        shell: bash
        run: |
          npm ci
          npm run build

      # Same script CI uses, so the release path and the PR path enforce
      # exactly the same thing: --features core (services.rs and the scrub
      # modules are core-gated), --test-threads=1 (they race on a
      # process-global storage key), and the documented, expiring quarantine
      # for tests that assert facts about the operator's machine.
      - name: Test OSL Privacy core
        shell: bash
        run: bash scripts/ci/hub-core-tests.sh

      - name: Test OSL Privacy Windows identity lifecycle
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features core --test windows_identity_lifecycle -- --test-threads=1

      - name: Audit OSL Privacy updater supply-chain policy
        # windows-latest defaults to PowerShell, which does NOT stop on a
        # non-zero native exit: the first command here could fail and the
        # step would still pass on the last command's status.
        shell: bash
        run: |
          python scripts/audit_hub_release.py
          python -m unittest scripts/test_verify_hub_vm_qa_attestation.py

      - name: Build signed draft installer and updater manifest
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HUB_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.HUB_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/osl-hub
          tagName: hub-v__VERSION__
          releaseName: OSL Privacy __VERSION__
          releaseBody: Signed OSL Privacy candidate. It remains a draft until the two-clean-VM QA gate passes.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: osl-hub-[version]-[arch]-[bundle].[ext]
          args: --features desktop
