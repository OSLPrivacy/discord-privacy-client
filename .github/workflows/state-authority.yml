name: State authority

on:
  pull_request:
  push:
    # D-172. Note this workflow does not exist on the default branch at all --
    # `gh run list --workflow state-authority.yml` answers 404 -- so before this
    # line it had never run anywhere, on any branch, ever. It is green on
    # integrate/first-usable today (measured 2026-08-04), which is the whole
    # reason it is worth switching on rather than quarantining.
    branches: [main, 'integrate/**']

permissions:
  contents: read

jobs:
  state-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate declared state authority and changed stateful code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/test_check_state_authority.py
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check-state-authority.py
          else
            python3 scripts/check-state-authority.py --git-range "$BASE_SHA...$HEAD_SHA"
          fi
