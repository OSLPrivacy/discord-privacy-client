name: Promote VM-tested OSL Privacy candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft hub-v* release whose exact installer was tested
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote-tested-candidate:
    runs-on: ubuntu-latest
    # Configure required human reviewers on this environment. Approval is
    # intentionally separate from the environment holding signing secrets.
    environment: hub-vm-qa
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate requested candidate tag
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          if [[ ! "$CANDIDATE_TAG" =~ ^hub-v[0-9A-Za-z.+-]{1,64}$ ]]; then
            echo "candidate_tag must be a bounded hub-v* tag" >&2
            exit 1
          fi

      - name: Download draft candidate and two-VM attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          test "$(gh release view "$CANDIDATE_TAG" --json isDraft --jq .isDraft)" = "true"
          mkdir -p candidate
          gh release download "$CANDIDATE_TAG" --pattern '*.exe' --dir candidate
          gh release download "$CANDIDATE_TAG" --pattern latest.json --dir candidate
          gh release download "$CANDIDATE_TAG" --pattern hub-vm-qa-attestation.json --dir candidate

      - name: Verify exact installer and required clean-VM cases
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python scripts/verify_hub_vm_qa_attestation.py \
            --tag "$CANDIDATE_TAG" \
            --candidate-dir candidate \
            --attestation candidate/hub-vm-qa-attestation.json

      # `signedUpdate` cannot be attested before a feed exists, and a feed cannot exist before a
      # promotion. The attestation may waive that one case, but only while the excuse is true:
      # this step reads the live feed and refuses the waiver the moment hub-latest publishes a
      # manifest, so the exception expires by itself.
      - name: Refuse a bootstrap QA waiver once the update feed exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The waiver expires against reality: it is refused the moment hub-latest
          # publishes a manifest. That only works if "no feed" and "gh broke" are
          # told apart. The old form was `|| : > feed-assets.json`, which truncated
          # the file on ANY gh failure -- a rate limit, a token-scope change, a
          # transient API error -- and an empty file reads as "no feed yet", so the
          # waiver was ACCEPTED. The expiry failed OPEN, and `2>/dev/null` threw
          # away the reason. Fail closed on anything that is not a missing release.
          if gh release view hub-latest --json assets > feed-assets.json 2> gh-feed-err.txt; then
            :
          else
            rc=$?
            if grep -qi 'release not found' gh-feed-err.txt; then
              : > feed-assets.json
            else
              echo "gh release view failed (exit ${rc}); refusing to assume the feed is absent:" >&2
              cat gh-feed-err.txt >&2
              exit 1
            fi
          fi
          python scripts/check_bootstrap_waiver_allowed.py \
            --attestation candidate/hub-vm-qa-attestation.json \
            --feed-assets feed-assets.json

      # The gate above proves the manifest satisfies our promotion policy. This proves an
      # installed client would actually install it: the artifact resolves, and its minisign
      # signature verifies under the public key compiled into the shipped binary.
      - name: Verify an installed client would accept this manifest
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check cryptography
          installer="$(ls candidate/*.exe)"
          python scripts/verify_update_feed_acceptance.py \
            --manifest candidate/latest.json \
            --installer "$installer"

      - name: Publish only the attested draft and move OSL Privacy update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          gh release edit "$CANDIDATE_TAG" --draft=false
          if ! gh release view hub-latest >/dev/null 2>&1; then
            gh release create hub-latest \
              --title "OSL Privacy update feed" \
              --notes "Stable signed update manifest for OSL Privacy."
          fi
          gh release upload hub-latest candidate/latest.json --clobber
