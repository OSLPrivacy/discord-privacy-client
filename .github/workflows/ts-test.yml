name: TypeScript Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # D-172. `integrate/**` was added because `gh run list --branch
    # integrate/first-usable` returned NOTHING: this workflow was a statement
    # about `main` only, while `integrate/first-usable` is the branch we
    # integrate into and cut builds from. The keyserver bundle step below was
    # added to catch D-162 and could not run at all until this line existed.
    branches: [main, 'integrate/**']
  pull_request:
  # D-195: the only trigger a commit message cannot suppress. `[skip ci]` in a
  # commit subject cancels `push` and `pull_request` outright; see the ruling in
  # integration-gate.yml. This makes a skipped run re-gradable by hand.
  workflow_dispatch:

jobs:
  # D-172. These two gates used to be the first two steps of EVERY lane of the
  # matrix below. Two consequences, both bad:
  #   1. They ran four times per push, identically.
  #   2. `check-app-claims.mjs` is red on integrate/first-usable (6 violations,
  #      quarantined in scripts/ci/quarantine.json), and Actions aborts a job at
  #      its first failing step -- so while it is red NOTHING ELSE IN THIS
  #      WORKFLOW RUNS. Every lane, including the Worker bundle gate the D-162
  #      lane added specifically so a broken deploy could not recur, was dead
  #      behind it.
  # Hoisting them into their own job weakens nothing: both still run, both still
  # fail the workflow through the `success'` aggregate, and the aggregate now
  # names them. It only stops one red gate from silencing four unrelated ones.
  claim-gates:
    name: Claim and plan-governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      # Zero-dependency: nothing to install and nothing that can fail for
      # unrelated reasons. Ban list is parsed out of
      # docs/design/osl-public-claim-allowlist.md section D, so adding a banned
      # phrase there automatically tightens this.
      - name: Claim-gate-in-app-copy-and-README
        run: |
          node scripts/check-app-claims.mjs --self-test
          node scripts/check-app-claims.mjs
      # D-194: `Claim-gate-in-app-copy-and-README` is RED on integrate/** (6
      # violations, quarantined by identity in scripts/ci/quarantine.json), so
      # without this condition the plan-governance gate beside it is reported
      # `skipped` on every push -- the same masking pattern that hoisting these
      # two into their own job was supposed to end. `!cancelled()` makes a red
      # step above stop being able to skip this one. The job still goes red.
      - name: Plan-governance-acceptance-gates
        if: ${{ !cancelled() }}
        run: python3 scripts/validate-plan-governance.py

  ts-test:
    # t8-a5 moved this off windows-latest; t8-a6 added the 4-way shard but was
    # written before that landed. Both are wanted: shard ON ubuntu, since the
    # move off Windows runners is the newer and deliberate decision.
    runs-on: ubuntu-latest
    name: TypeScript (${{ matrix.lane }})
    strategy:
      # D-172. Actions defaults matrix fail-fast to TRUE, so on the first run
      # this workflow ever had on integrate/first-usable (30930446663) the
      # cipher-store lane failed and the keyserver and osl-hub-ui lanes were
      # CANCELLED. A cancelled lane is not a red one and it is not a green one
      # either -- it is a lane whose result nobody has. Splitting the workers
      # lane in two is pointless if one half can still cancel the other.
      fail-fast: false
      matrix:
        # D-172: `workers` was ONE lane running keyserver-cf then
        # cipher-store-cf. keyserver-cf's typecheck exits 2 on 13 pre-existing
        # errors, so every cipher-store step after it had never executed in CI
        # -- which is why cipher-store-cf's own 7 TypeScript errors and 4 test
        # failures were unrecorded until D-172 measured them by hand. One lane
        # each; neither worker can mask the other.
        lane: [webview, osl-hub-ui, keyserver-worker, cipher-store-worker, legacy-keyserver]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webview/package-lock.json
            apps/osl-hub-ui/package-lock.json
            keyserver-cf/package-lock.json
            cipher-store-cf/package-lock.json
            keyserver/package-lock.json
      # D-172: the claim gate and the plan-governance gate used to stand here,
      # ahead of every lane. They now live in the `claim-gates` job above. See
      # the comment there -- while the claim gate was red, this entire matrix
      # was dead.
      #
      # D-194: every step below the per-lane `npm ci` carries `!cancelled()` as
      # well as its lane condition. Within a lane the same masking applies as
      # between jobs: `Typecheck keyserver worker` exits 2 on 13 pre-existing
      # errors, so `Test keyserver worker` beneath it was reported `skipped` on
      # every push to integrate/**, and `Typecheck cipher-store worker` (red at
      # 7) did the same to the cipher-store suite. Ordering alone cannot fix
      # that -- there is no order in which a red step is not in front of
      # something. The integration-gate.yml `worker-bundles` job already uses
      # this pattern, for the same reason. Nothing is softened: a red step still
      # fails its lane, and the lane still fails `success'`.
      - name: Install webview deps
        if: ${{ matrix.lane == 'webview' }}
        working-directory: webview
        run: npm ci
      - name: Typecheck webview
        if: ${{ !cancelled() && matrix.lane == 'webview' }}
        working-directory: webview
        run: npm run typecheck
      - name: Lint webview
        if: ${{ !cancelled() && matrix.lane == 'webview' }}
        working-directory: webview
        run: npm run lint
      - name: Test webview
        if: ${{ !cancelled() && matrix.lane == 'webview' }}
        working-directory: webview
        run: npm test
      # The app frontend is outside webview/ and has its own lockfile, tests,
      # TypeScript check, and production Vite build.
      - name: Install OSL Privacy UI dependencies
        if: ${{ matrix.lane == 'osl-hub-ui' }}
        working-directory: apps/osl-hub-ui
        run: npm ci
      # D-172: BUILD FIRST. `npm test` is `vitest run && node --test
      # screenshots/*.test.mjs` and it is red on integrate/first-usable, so on
      # run 30931564095 `Build OSL Privacy UI` -- which is
      # `tsc --noEmit && vite build`, the production build of the renderer that
      # SHIPS -- was reported `skipped`. The suite that says whether the code is
      # correct was standing in front of the check that says whether the code
      # can be built at all. If you ever move this step down, you have disabled
      # it. (integration-gate.yml owns the same check as its own job, which is
      # why the branch still had a build gate while this one was skipped.)
      - name: Build OSL Privacy UI
        if: ${{ !cancelled() && matrix.lane == 'osl-hub-ui' }}
        working-directory: apps/osl-hub-ui
        run: npm run build
      # D-233. Five cases of this suite had NEVER run in CI. `locateChrome()` in
      # scripts/lib/cdp-harness.mjs searches exactly two places -- $OSL_CHROME
      # and ~/.cache/ms-playwright/** -- and this lane installs neither, so
      # attachment-progress, cover-generation and csp-render-gate each threw
      #   "no Chrome/Chromium binary found; set OSL_CHROME to a local browser
      #    binary"
      # at cdp-harness.mjs:29, and scrollbar-theme's two cases died the same way
      # on the same missing browser. Four of those are real render gates driven
      # through CDP, and one of them is the CSP render gate -- the gate that
      # exists because `style-src 'self'` once silently dropped runtime styles
      # and the navigation shipped unstyled. A browser gate that never launches
      # a browser cannot catch that; it only reports it as an error about a
      # missing binary, which reads as infrastructure noise.
      #
      # OSL_CHROME points at the browser the runner image already ships
      # (ubuntu-24.04: Google Chrome, /usr/bin/google-chrome). This is the same
      # line the quarantine-ratchet job of integration-gate.yml and the
      # website-evidence job of site-tests.yml already carry, for the same
      # script and the same reason. `locateChrome` checks the path exists before
      # using it, so it is inert on a machine without it -- a developer with a
      # Playwright cache still resolves through the cache.
      #
      # NOTHING IS WEAKENED. No test is skipped, softened or allowlisted: five
      # cases that could not reach their subject now execute against a real
      # browser, and if they find something they go red.
      - name: Test OSL Privacy UI
        if: ${{ !cancelled() && matrix.lane == 'osl-hub-ui' }}
        working-directory: apps/osl-hub-ui
        env:
          OSL_CHROME: /usr/bin/google-chrome
        run: npm test
      - name: Install keyserver worker deps
        if: ${{ matrix.lane == 'keyserver-worker' }}
        working-directory: keyserver-cf
        run: npm ci
      # D-162. This runs the REAL esbuild bundle that `wrangler deploy` runs, so
      # an import with no matching export cannot reach a deploy again. --dry-run
      # writes a local outdir and contacts no Cloudflare account state.
      #
      # It runs FIRST, ahead of typecheck and vitest, and that ordering is the
      # whole point (D-162 adversary, hole 2). `npm run typecheck` currently
      # exits 2 on 13 pre-existing errors; a step placed after it would never
      # execute, because Actions aborts a job at the first failing step. It is
      # also ahead of `npm test` so a bundle failure is reported as a bundle
      # failure rather than as 27 mystery test failures.
      #
      # If you ever move this step down, you have disabled it.
      #
      # D-172: this gate also exists as its own job in integration-gate.yml, and
      # that is not redundant. This copy covers `main` and pull requests, where
      # integration-gate.yml does not run; that copy covers integrate/**, where
      # this lane's own typecheck is red and a reader would reasonably stop
      # reading. Neither one is allowed to be the only one.
      - name: Build keyserver worker bundle (dry run)
        if: ${{ !cancelled() && matrix.lane == 'keyserver-worker' }}
        working-directory: keyserver-cf
        run: npm run verify:worker-build
      - name: Typecheck keyserver worker
        if: ${{ !cancelled() && matrix.lane == 'keyserver-worker' }}
        working-directory: keyserver-cf
        run: npm run typecheck
      - name: Test keyserver worker
        if: ${{ !cancelled() && matrix.lane == 'keyserver-worker' }}
        working-directory: keyserver-cf
        run: npm test
      - name: Install cipher-store worker deps
        if: ${{ matrix.lane == 'cipher-store-worker' }}
        working-directory: cipher-store-cf
        run: npm ci
      # D-162, same reasoning as the keyserver bundle above, and FIRST for the
      # same reason: nothing else in this repo runs esbuild over
      # cipher-store-cf/src, so nothing else can see an import with no matching
      # export. Verified locally: Total Upload 114.60 KiB, exit 0.
      - name: Build cipher-store worker bundle (dry run)
        if: ${{ !cancelled() && matrix.lane == 'cipher-store-worker' }}
        working-directory: cipher-store-cf
        run: npm run verify:worker-build
      - name: Typecheck cipher-store worker
        if: ${{ !cancelled() && matrix.lane == 'cipher-store-worker' }}
        working-directory: cipher-store-cf
        run: npm run typecheck
      - name: Test cipher-store worker
        if: ${{ !cancelled() && matrix.lane == 'cipher-store-worker' }}
        working-directory: cipher-store-cf
        run: npm test
      # D-281. THE TERMINAL ANCHOR FOR THE RELEASE CONTRACT, and it has to be a
      # CI step rather than another line in the suite.
      #
      # D-262 gave the seven named security-property suites a gate (registered
      # exactly once, active `describe`/`it`, load-bearing assertion text still
      # present, plus a per-directory file floor), anchored by running FIRST in
      # `npm test` -- and `package.json` is inside the release digest, so
      # dropping the step turns the release-source contract red. That is real and
      # the lane that built it recorded its limit honestly:
      #
      #   NO IN-SUITE GATE SURVIVES DELETION OF THE GATE ITSELF.
      #
      # Gutting `scripts/d2-test-closure.ts` AND deleting the specs escapes
      # everything inside the suite, because everything inside the suite is
      # configured by the suite. `npm test` above is exactly that: a string in
      # `package.json`. So the anchor runs the named specs BY EXPLICIT PATH,
      # against its own second copy of the names held in scripts/ci/** -- a
      # different ownership domain -- and grades the JSON report rather than the
      # exit code, because `describe.skip` leaves vitest exit 0. Read the header
      # of the script; the three load-bearing choices are argued there.
      #
      # WHY HERE AND NOT A NEW JOB: this lane already ran `npm ci` for
      # cipher-store-cf, already has the workerd pool warm and already has the
      # node the specs need. A standalone job pays a second cold install for the
      # same six spec files.
      #
      # WHY AFTER `npm test` AND NOT BEFORE, and this is the part that has
      # already bitten this repository three times (D-194): Actions aborts a job
      # at its first failing step. A ratchet placed in front of a test step that
      # carries no condition SKIPS that test when the ratchet goes red -- which is
      # how a formatting nit hid the entire Rust suite, twice. So the anchor is
      # BELOW the suite it backstops, and both new steps carry `!cancelled()`, so
      # a red suite cannot skip the anchor either. Neither can mask the other, and
      # .github/workflows/ts-test.workflow-test.py asserts that ordering rather
      # than trusting it -- from the `quality-checks` job of rust-test.yml, a
      # different workflow, for the same reason the other contracts run there.
      #
      # The self-test first, per D-195: a grader nobody has seen fail is
      # decoration, and its exit code must be a step result of its own rather
      # than a line inside a multi-command `run:`.
      - name: Prove the D-281 spec anchor can fail
        if: ${{ !cancelled() && matrix.lane == 'cipher-store-worker' }}
        run: node scripts/ci/d2-property-spec-anchor.mjs --self-test
      - name: D-281 release-contract terminal anchor
        if: ${{ !cancelled() && matrix.lane == 'cipher-store-worker' }}
        run: node scripts/ci/d2-property-spec-anchor.mjs
      - name: Install legacy keyserver deps
        if: ${{ matrix.lane == 'legacy-keyserver' }}
        working-directory: keyserver
        run: npm ci
      - name: Test legacy keyserver
        if: ${{ !cancelled() && matrix.lane == 'legacy-keyserver' }}
        working-directory: keyserver
        run: npm test
  selector-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install selector check deps
        working-directory: selector-ci
        run: npm ci
      - name: Run selector check
        working-directory: selector-ci
        run: npm run check
  telegram-reporting-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install keyserver worker deps
        working-directory: keyserver-cf
        run: npm ci
      - name: keyserver-cf/scripts/test-configure-telegram-reporting-bot.sh
        run: bash keyserver-cf/scripts/test-configure-telegram-reporting-bot.sh
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run public audit
        run: |
          python3 scripts/audit_reproducible_build.py --self-test
          python3 - <<'PY'
          from scripts.audit_public_release import audit_public_release_claims_self_test

          errors = []
          audit_public_release_claims_self_test(errors)
          if errors:
              raise SystemExit("\n".join(errors))
          PY
  success:
    name: "success'"
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      # D-172: claim-gates was hoisted out of the ts-test matrix so one red gate
      # could stop silencing four unrelated lanes. It is named here so hoisting
      # it did not also remove it from the required set -- moving a gate must
      # never quietly demote it.
      - claim-gates
      - ts-test
      - selector-check
      - telegram-reporting-bot
      - public-audit
    steps:
      - name: "success'"
        env:
          CLAIM_GATES_RESULT: ${{ needs.claim-gates.result }}
          TEST_RESULT: ${{ needs.ts-test.result }}
          SELECTOR_CHECK_RESULT: ${{ needs.selector-check.result }}
          TELEGRAM_REPORTING_BOT_RESULT: ${{ needs.telegram-reporting-bot.result }}
          PUBLIC_AUDIT_RESULT: ${{ needs.public-audit.result }}
        run: |
          require_required_checks_green() {
            failed=0
            for check in "$@"; do
              label="${check%%=*}"
              result="${check#*=}"
              if [ "$result" != 'success' ]; then
                echo "$label failed with result: $result"
                failed=1
              fi
            done
            return "$failed"
          }

          require_required_checks_green \
            'Claim and plan-governance gates=success' \
            'TypeScript workflow=success' \
            'Selector check=success' \
            'Telegram reporting bot script check=success' \
            'Public audit=success'

          for failed_check in \
            'Claim and plan-governance gates=failure' \
            'Claim and plan-governance gates=skipped' \
            'TypeScript workflow=failure' \
            'Selector check=cancelled' \
            'Telegram reporting bot script check=skipped' \
            'Public audit=failure'
          do
            if self_test_output=$(require_required_checks_green \
              "$failed_check" \
              'other required check=success')
            then
              echo "success' self-test accepted a non-green required check: $failed_check"
              exit 1
            fi
            expected_message="${failed_check%%=*} failed with result: ${failed_check#*=}"
            if [ "$self_test_output" != "$expected_message" ]; then
              echo "success' self-test produced the wrong refusal for: $failed_check"
              echo "expected: $expected_message"
              echo "actual: $self_test_output"
              exit 1
            fi
          done

          require_required_checks_green \
            "Claim and plan-governance gates=$CLAIM_GATES_RESULT" \
            "TypeScript workflow=$TEST_RESULT" \
            "Selector check=$SELECTOR_CHECK_RESULT" \
            "Telegram reporting bot script check=$TELEGRAM_REPORTING_BOT_RESULT" \
            "Public audit=$PUBLIC_AUDIT_RESULT"
