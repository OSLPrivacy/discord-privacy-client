name: TypeScript Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Claim gate for in-app copy and README. Zero-dependency, so it runs before
      # any npm ci: nothing to install and nothing that can fail for unrelated
      # reasons. Ban list is parsed out of docs/design/osl-public-claim-allowlist.md
      # section D, so adding a banned phrase there automatically tightens this.
      - name: Claim-gate-in-app-copy-and-README
        run: |
          node scripts/check-app-claims.mjs --self-test
          node scripts/check-app-claims.mjs
      - name: Install webview deps
        working-directory: webview
        run: npm ci
      - name: Typecheck webview
        working-directory: webview
        run: npm run typecheck
      - name: Lint webview
        working-directory: webview
        run: npm run lint
      - name: Test webview
        working-directory: webview
        run: npm test
      # The app frontend is outside webview/ and has its own lockfile, tests,
      # TypeScript check, and production Vite build.
      - name: Install OSL Privacy UI dependencies
        working-directory: apps/osl-hub-ui
        run: npm ci
      - name: Test OSL Privacy UI
        working-directory: apps/osl-hub-ui
        run: npm test
      - name: Build OSL Privacy UI
        working-directory: apps/osl-hub-ui
        run: npm run build
      - name: Install keyserver worker deps
        working-directory: keyserver-cf
        run: npm ci
      - name: Typecheck keyserver worker
        working-directory: keyserver-cf
        run: npm run typecheck
      - name: Test keyserver worker
        working-directory: keyserver-cf
        run: npm test
      - name: Install cipher-store worker deps
        working-directory: cipher-store-cf
        run: npm ci
      - name: Typecheck cipher-store worker
        working-directory: cipher-store-cf
        run: npm run typecheck
      - name: Test cipher-store worker
        working-directory: cipher-store-cf
        run: npm test
      - name: Install legacy keyserver deps
        working-directory: keyserver
        run: npm ci
      - name: Test legacy keyserver
        working-directory: keyserver
        run: npm test
  selector-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install selector deps
        working-directory: selector-ci
        run: npm ci
      - name: Run selector check
        working-directory: selector-ci
        run: npm run check
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run public audit
        run: |
          python3 scripts/audit_reproducible_build.py --self-test
          python3 - <<'PY'
          from scripts.audit_public_release import audit_public_release_claims_self_test

          errors = []
          audit_public_release_claims_self_test(errors)
          if errors:
              raise SystemExit("\n".join(errors))
          PY
  success:
    name: "success'"
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - test
      - selector-check
      - public-audit
    steps:
      - name: Require TypeScript, selector, and public-audit success
        run: |
          failed=0
          if [ '${{ needs.test.result }}' != 'success' ]; then
            echo "TypeScript workflow failed with result: ${{ needs.test.result }}"
            failed=1
          fi
          if [ '${{ needs.selector-check.result }}' != 'success' ]; then
            echo "Selector check failed with result: ${{ needs.selector-check.result }}"
            failed=1
          fi
          if [ '${{ needs.public-audit.result }}' != 'success' ]; then
            echo "Public audit failed with result: ${{ needs.public-audit.result }}"
            failed=1
          fi
          exit "$failed"
