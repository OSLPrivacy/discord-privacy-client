name: Rust Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # D-172. This workflow owns the two most expensive truths in the repo -- the
    # workspace suite and `hub-desktop-bin`, the only job that builds the app as
    # it ships -- and until this line existed it asserted them about `main` only.
    # D-146 was an integration head that could not build the shipping app at all
    # while three suites were green; this job would have caught it on the push
    # that broke it, and could not, because it never ran on that branch.
    branches: [main, 'integrate/**']
  pull_request:

jobs:
  # D-172. Its own job, and that is the entire point -- see the comment where it
  # used to live, in `test` below. A formatting check is the cheapest possible
  # step and it was gating the most expensive truth in the repository.
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          # Keep CI aligned with Cargo.toml's workspace rust-version.
          toolchain: '1.97.1'
          components: rustfmt, clippy
      # 9-TD1: rust-cache keeps cold-cache 5-7 min runs from blowing
      # out PR feedback latency once Phase F adds new crates.
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          # t8-a3 caches BOTH workspaces (apps/osl-hub is a separate manifest,
          # not a workspace member, so it needs its own entry); t8-a4 restricts
          # cache SAVES to main so PR runs read the cache without each writing
          # their own. Independent settings -- keep both.
          workspaces: |
            . -> target
            apps/osl-hub -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # D-172: `cargo fmt --all -- --check` used to stand HERE, as step 5 of this
      # job, and it is RED on integrate/first-usable -- 53 files, 138 hunks. So
      # on the first run this workflow ever had on that branch (30930446508),
      # clippy, `cargo test --workspace`, nextest and BOTH apps/osl-hub
      # `--features core` steps were all reported `skipped`. Actions aborts a job
      # at its first failing step, so a formatting nit was hiding the entire Rust
      # test suite. It is now the `fmt` job below: still required, still red,
      # and no longer standing in front of anything.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # nextest runs each test in its own process for fast isolated feedback.
      # Keep cargo test above: its shared test-process shape can expose
      # process-global-state races that nextest structurally cannot.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-nextest
      - name: Run workspace tests with nextest
        run: cargo nextest run --workspace --profile ci
      # The app is intentionally an isolated Cargo workspace, so root
      # --workspace checks do not cover it. Keep its core and Windows-only
      # restart lifecycle on the ordinary PR path as well as release CI.
      - name: Test OSL Privacy core
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features core --lib
      - name: Test OSL Privacy Windows identity lifecycle
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features core --test windows_identity_lifecycle

  # D-152. The two steps above are `--features core --lib` plus one integration
  # test, and `apps/osl-hub`'s `[[bin]]` is `required-features = ["desktop"]`
  # (Cargo.toml:139-142). So neither of them compiles a single line of
  # `src/main.rs`, `native_discord_overlay.rs`, `native_attachment_transport.rs`,
  # `native_image_viewer.rs`, `native_whatsapp_overlay.rs` or `window_border.rs`
  # -- and `apps/osl-hub` is outside the root workspace, so
  # `cargo clippy --workspace -D warnings` never sees them either. The binary is
  # where the app starts and it was the least gated code in the repository: its
  # 116 tests did not compile on a pristine tree and had not for a long time.
  # This job owns them.
  #
  # It is also the only job that builds the app as it ships. `tauri_build::build()`
  # runs only under `desktop` (build.rs:27-29), and it is what validates
  # `capabilities/*.json` against the command registry. D-146 was an integration
  # branch that could not build the shipping app at all while the workspace suite
  # (1997/0), the hub suite (1212/1) and the frontend suite (1604/0) were green,
  # for exactly that reason.
  #
  # Windows, not Linux, because Windows is what ships: it compiles the
  # `cfg(windows)` halves of the binary as well, which no other job does.
  #
  # If you are deleting this job, `quality-checks` below will fail and tell you
  # what you are giving up. That is deliberate.
  hub-desktop-bin:
    name: OSL Privacy desktop binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/osl-hub -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `tauri.conf.json` sets frontendDist to `../osl-hub-ui/dist`, and
      # `tauri_build::build()` reads it, so the renderer has to exist before
      # cargo is invoked at all.
      - name: Build the embedded frontend
        working-directory: apps/osl-hub-ui
        run: |
          npm ci
          npm run build
      # --test-threads=1: `set_file_storage_key` is process-global.
      - name: Test the OSL Privacy desktop binary
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features desktop --bin osl-privacy-hub -- --test-threads=1

  # D-160. Until this job existed, `grep -rn "scripts/ledger" .github/workflows/`
  # returned one comment and nothing else: eight Binding Ledgers, and the only
  # thing that ran them was a human remembering to. That is the failure PLAN.md
  # §9 already names -- "verify_all.sh existed and no loop ever ran it" --
  # applied to the mechanism built to replace it. Everything the ledgers caught
  # on 2026-08-03 (a branch that could not build the shipping app, two commands
  # dead on the IPC surface, a prohibition guarded by a tautology) was caught
  # because someone typed the command by hand.
  #
  # Ledgers 1-7 are green and any violation here fails the build. Ledger 8 is
  # RED with 20, correctly -- D-092, D-108 and D-114 are open defects, not noise
  # -- so it is ratcheted against scripts/ledger/state-baseline.json rather than
  # gated at zero: a permanently-red CI trains everyone to ignore it, which is
  # the same defeat in a different costume. The baseline fails on an increase AND
  # on a decrease that did not lower the file in the same change. It is not an
  # exception file; exceptions/*.json record things that do not ship, and every
  # id in the baseline ships. See scripts/ledger/all.mjs for the full policy.
  #
  # ubuntu, not windows-latest: this is a node-only check and belongs with the
  # other node checks. It runs rollup (ledger 7 asks the bundler for real module
  # ids, which is why apps/osl-hub-ui dependencies are installed) and it invokes
  # no cargo at all.
  #
  # If you are deleting this job, `quality-checks` below will fail and name it.
  binding-ledgers:
    name: Binding Ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json
      # Ledger 7 drives a real vite/rollup build to get `this.getModuleIds()`,
      # and vite is a devDependency of apps/osl-hub-ui, not of the repo root.
      - name: Install the renderer's dependencies
        working-directory: apps/osl-hub-ui
        run: npm ci
      # --no-cache is mandatory. Without it, ledgers 1 and 7 refuse to report
      # from a stale bundle cache and fail loudly instead of guessing. That
      # refusal is correct behaviour -- do not "fix" it by dropping the flag.
      - name: Run all eight Binding Ledgers
        run: node scripts/ledger/all.mjs --no-cache

  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      # boot.js is parsed by WebView2 (V8) at runtime; a syntax error
      # there is a hard crash for every OSL user with no fast feedback
      # short of a manual launch. `node --check` reproduces that
      # parse step in ~50ms per file.
      - name: boot.js parses
        run: node --check src-tauri/src/injection/boot.js
      # D-159: the "Capability audit" step that stood here ran
      # scripts/audit_capabilities.py, which audited src-tauri/** -- the
      # legacy shell excluded from the workspace and built by no release
      # job -- and printed "OK: 126 commands audited, all 5 artifacts
      # present" while apps/osl-hub, the app that actually ships, held
      # three commands registered on its IPC surface with no grant
      # anywhere (D-158) and a permission whose command had been deleted
      # (D-146, which broke the build twice in one day). A green line
      # about code that does not ship is worse than no line. The
      # five-artifact discipline now lives in scripts/ledger/acl-diff.mjs
      # and scripts/ledger/commands.mjs, aimed at apps/osl-hub; see
      # scripts/CAPABILITY_AUDIT.md for the artifact-to-enforcer map. D-159
      # left one open item -- the ledgers were not a CI job -- and the
      # `binding-ledgers` job above closes it.
      # This file has held the rust-cache write policy since it was written and
      # nothing has ever executed it. It now also holds D-152's contract that
      # some job runs the shipping binary's test target, which is only worth
      # anything if it runs from a DIFFERENT job than the one it guards -- delete
      # `hub-desktop-bin` above and this step is what fails.
      - name: Rust workflow contract
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/workflows/rust-test.workflow-test.py
      # D-172. A trigger is one line and one line is easy to lose in a merge.
      # This asserts that the five workflows that gate `integrate/**` still do,
      # that the five that deploy/publish/open-issues still do not, and that
      # integration-gate.yml still contains all four shipping-artifact build
      # gates as SEPARATE jobs. It runs from this job -- a different workflow
      # from the one it mostly guards -- for the same reason the rust contract
      # above does: a contract enforced only by the thing it constrains is not
      # enforced.
      - name: Integration-branch gating contract
        run: python3 .github/workflows/integration-branch-gating.test.py
