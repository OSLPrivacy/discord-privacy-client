name: Rust Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Split out from the old single `test` job. Previously fmt, clippy and every
  # test ran as sequential steps in one job, so the FIRST failure hid all the
  # rest: main was red from 2026-07-19 to 2026-07-26 on a single style lint,
  # and `cargo test --workspace` never once executed in that window. Nobody
  # could tell whether the tests passed, because clippy always failed first.
  workspace-test:
    name: workspace build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          # Keep CI aligned with rust-toolchain.toml and Cargo.toml's
          # workspace rust-version. All three must move together.
          toolchain: '1.88.0'
      # 9-TD1: rust-cache keeps cold-cache 5-7 min runs from blowing
      # out PR feedback latency once Phase F adds new crates.
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      # The SAME compile-time-embed trap as apps/osl-hub, on the legacy root
      # app: src-tauri/tauri.conf.json sets frontendDist to ../webview/dist,
      # and `tauri::generate_context!()` panics at compile time if that path
      # does not exist. webview/dist is a build output and is not committed,
      # so any root cargo command that reaches the bin fails without this.
      # It went unnoticed because clippy failed on crates/ipc first and
      # never got this far.
      - name: Build the embedded webview frontend first
        working-directory: webview
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: cargo test --workspace

  # apps/osl-hub declares its own `[workspace]`, so root `--workspace` commands
  # do not reach it at all. Its tests need three things encoded, each of which
  # has previously cost real debugging time:
  #   1. an explicit --manifest-path (it is not a root member);
  #   2. --features core (services.rs, scrub_imap.rs and scrub_index.rs are
  #      core-gated, so a plain `cargo test` skips them entirely and is
  #      vacuous for exactly the modules most worth testing);
  #   3. --test-threads=1, because those tests race on a process-global
  #      storage key and pass or fail depending on scheduling.
  hub-core-test:
    name: osl-hub core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/osl-hub
      - name: Test OSL Privacy core
        shell: bash
        run: bash scripts/ci/hub-core-tests.sh
      - name: Test OSL Privacy Windows identity lifecycle
        run: cargo test --manifest-path apps/osl-hub/Cargo.toml --features core --test windows_identity_lifecycle -- --test-threads=1

  # `--features core` does NOT compile main.rs: the bin is gated behind
  # required-features = ["desktop"]. Until now the shipped binary's main.rs
  # was therefore only ever type-checked at tag time, inside the signing
  # workflow — the worst possible place to discover it does not build.
  # The frontend must be built first because Tauri embeds apps/osl-hub-ui/dist
  # at COMPILE time; without it this check either fails or bakes a stale UI.
  hub-desktop-check:
    name: osl-hub desktop binary compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/osl-hub-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/osl-hub
      - name: Build trusted frontend before any Rust build
        working-directory: apps/osl-hub-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check the desktop binary
        run: cargo check --manifest-path apps/osl-hub/Cargo.toml --features desktop --bin osl-privacy-hub

  # Lint is deliberately a separate job from build-and-test so that a
  # cosmetic finding can never again mask the release-relevant signal.
  lint:
    name: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      # --all-targets reaches the src-tauri bin, so this job needs
      # webview/dist for the same reason workspace-test does.
      - name: Build the embedded webview frontend first
        working-directory: webview
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Deterministic, zero-false-positive, and already clean on main.
      - run: cargo fmt --all -- --check
      # Blocking clippy denies the classes that describe defects — rustc's own
      # warnings (unused, dead code, deprecated), plus clippy::correctness,
      # ::suspicious, ::complexity and ::perf, all of which stay denied via
      # `-D warnings`. Only `clippy::style` is downgraded, and only here.
      #
      # This is the change that unsticks main. `clippy::question_mark` at
      # crates/ipc/src/commands.rs:8901 is a pure style preference — write
      # `foo()?;` instead of `if let Err(e) = foo() { return Err(e); }` — and
      # it blocked every merge to a public repository for a week. A release
      # pipeline that a style preference can halt is not a release pipeline.
      # Style findings are not discarded: the advisory step below still
      # reports every one of them.
      - name: Clippy (blocking classes)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::style
      # Full-strictness clippy, reported and never enforced, so the style debt
      # stays visible and quantified rather than silently accumulating.
      - name: Clippy (advisory, full strictness)
        id: clippy-advisory
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format short -- -D warnings 2>&1 | tee clippy-full.txt
          status=${PIPESTATUS[0]}
          count=$(grep -c 'error\(\[\|:\)' clippy-full.txt || true)
          {
            echo "### Clippy advisory (full \`-D warnings\`)"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Clean at full strictness."
            else
              echo "**$count** finding(s) that the blocking gate intentionally allows."
              echo
              echo '```'
              grep 'error\(\[\|:\)' clippy-full.txt | head -50
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  quality-checks:
    name: quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      # boot.js is parsed by WebView2 (V8) at runtime; a syntax error
      # there is a hard crash for every OSL user with no fast feedback
      # short of a manual launch. `node --check` reproduces that
      # parse step in ~50ms per file.
      - name: boot.js parses
        run: node --check src-tauri/src/injection/boot.js
      # 9-TD1.2: every #[tauri::command] needs all 5 artifacts. A
      # missing TOML or capability grant makes the command silently
      # unreachable from JS — we lost debug days to that pre-9-C1.
      - name: Capability audit
        run: python3 scripts/audit_capabilities.py
      # The release path is now made of YAML and shell. A typo in either is a
      # broken release discovered at tag time, so lint them like source.
      - name: Lint workflow YAML
        run: |
          curl -fsSL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: Lint CI shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/ci/*.sh scripts/release/*.sh
      # The attestation verifier is the only thing standing between a draft
      # and a published release. Its own unit tests must pass on every PR.
      - name: Release gate verifier self-test
        run: python3 -m unittest scripts/test_verify_hub_vm_qa_attestation.py
      # A gate only ever run against passing input is indistinguishable from
      # one that always returns true. This asserts it still REFUSES a
      # substituted binary, a single-VM run, a reused snapshot, an automated
      # CAPTCHA, and every other tested way of promoting an untested build.
      - name: Promotion gate refuses bad candidates
        run: bash scripts/release/prove-promotion-gate.sh
      # Rollback is the procedure nobody rehearses. These guards refuse the
      # two that would actually hurt: pointing the update feed at a draft that
      # was never published, and a "rollback" onto the live version.
      - name: Rollback guards refuse bad targets
        run: bash scripts/release/prove-rollback-guards.sh
      # The snapshot-lineage guard closes the one hole the Python verifier
      # cannot: an INVENTED goldenSnapshotId. Its self-test uses a stubbed
      # `az`, so it proves the logic without needing Azure credentials in CI.
      - name: Snapshot lineage guard refuses invented snapshots
        run: bash scripts/release/verify-snapshot-lineage.sh --self-test
      # Every OSL build is titled "OSL Privacy", so selecting a window by title
      # picks whichever build the machine happens to be running. That has
      # already driven the wrong lane's application through six UI steps.
      - name: Window targeting guard self-test
        run: bash scripts/ci/check-window-targeting.sh --self-test
      - name: No new title-based window targeting
        run: bash scripts/ci/check-window-targeting.sh
      # Both are dry-run/stub-driven, so they need no Azure or GitHub
      # credentials and cannot touch a real subscription or release.
      - name: Cold snapshot creator self-test
        run: bash scripts/release/create-cold-snapshot.sh --self-test
      - name: Release preflight self-test
        run: bash scripts/release/preflight.sh --self-test

  # Single stable check name for branch protection, so adding or renaming a
  # Rust job never silently un-enrols a required check.
  rust-gate:
    name: Rust gate
    runs-on: ubuntu-latest
    needs: [workspace-test, hub-core-test, hub-desktop-check, lint, quality-checks]
    if: always()
    steps:
      - name: Require every Rust job to pass
        run: |
          results="${{ needs.workspace-test.result }} ${{ needs.hub-core-test.result }} ${{ needs.hub-desktop-check.result }} ${{ needs.lint.result }} ${{ needs.quality-checks.result }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required Rust job did not pass ($results)" >&2
              exit 1
            fi
          done
          echo "All Rust jobs passed."
